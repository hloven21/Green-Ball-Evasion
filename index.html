<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Зелёный шар</title>
    <style>
        body {
            margin: 0;
            background: #05050a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #1a2a4a;
            box-shadow: 0 0 40px rgba(30, 80, 180, 0.4);
            max-width: 98vw;
            max-height: 98vh;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #restartBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 18px;
            background: #2a4a7a;
            color: #e0f0ff;
            border: 2px solid #4a80c0;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }
        #restartBtn:hover {
            background: #3a6aaa;
        }
    </style>
</head>
<body>
    <button id="restartBtn">↻ Полная перезагрузка</button>
    <canvas id="game" width="1200" height="800"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        const SPEED = 320;
        const BALL_RADIUS = 18;

        // Жёлтые шары
        const ENEMY_RADIUS = BALL_RADIUS / 2;
        const ENEMY_SPEED = SPEED;
        const WARNING_TIME = 1.0;

        const SPAWN_INTERVAL_INIT = 1.2;
        let SPAWN_INTERVAL = SPAWN_INTERVAL_INIT;
        const SPAWN_MIN = 0.3;
        const SPEEDUP_EVERY = 5;
        const SPEEDUP_FACTOR = 0.85;

        // Оранжевые треугольники
        const TRIANGLE_SIZE = 14;
        const TRIANGLE_SPEED = 210;
        const TRIANGLE_LIFETIME = 6.0;
        const TRIANGLE_SPAWN_INTERVAL = 2.5;
        const TRIANGLE_WARNING_TIME = 1.0;

        const TRIANGLE_TURN_RATE = 3.0;
        const TRIANGLE_GRIP = 2.2;
        const DRIFT_THRESHOLD = 0.35;

        const TRIANGLE_COLOR = "rgb(255, 120, 0)";

        // Белые ракеты
        const PLANE_SIZE = 16;
        const PLANE_SPEED = TRIANGLE_SPEED;
        const PLANE_SPAWN_INTERVAL = 1.75;
        const PLANE_EXPLOSION_RADIUS = BALL_RADIUS * 4;

        const PLANE_MAX_PATH = 1600;
        const PLANE_CHECK_MIN = 0.15;
        const PLANE_CHECK_MAX = 0.55;

        // ---------- ОПРЕДЕЛЕНИЕ УСТРОЙСТВА ----------
        // Смотрим три независимых признака и комбинируем.
        const uaIsMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i.test(navigator.userAgent);
        const hasTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
        const isSmallScreen = window.innerWidth < 900;

        // Устройство считаем мобильным, если это явно мобильная ОС,
        // ИЛИ если есть тач-ввод и экран небольшой (для планшетов и гибридов).
        const mobileDevice = uaIsMobile || (hasTouch && isSmallScreen);

        // ---------- УПРАВЛЕНИЕ ----------
        const CONTROL_MODES = ["keyboard", "mouse", "touch"];

        // Индекс режима: телефон → touch (2), ПК → keyboard (0)
        let controlModeIndex = mobileDevice ? 2 : 0;
        let controlMode = CONTROL_MODES[controlModeIndex];

        // Для отладки — можно посмотреть в консоли, как определилось устройство
        console.log("UA мобильный:", uaIsMobile, "| Тач:", hasTouch, "| Малый экран:", isSmallScreen, "| Итог: мобильный =", mobileDevice);

        let mouseX = WIDTH / 2;
        let mouseY = HEIGHT / 2;
        const MOUSE_DEADZONE = 4;

        // -------- ВИРТУАЛЬНЫЙ ДЖОЙСТИК --------
        const JOYSTICK_BASE_RADIUS = 120;
        const JOYSTICK_KNOB_RADIUS = 55;
        const JOYSTICK_MAX_DIST = JOYSTICK_BASE_RADIUS - 12;
        const JOYSTICK_MARGIN = 60;
        const JOYSTICK_GRAB_RADIUS = JOYSTICK_BASE_RADIUS * 1.4;
        const JOYSTICK_DEADZONE = 0.15;
        const JOYSTICK_ANALOG = false;

        const JOYSTICK_CX = JOYSTICK_MARGIN + JOYSTICK_BASE_RADIUS;
        const JOYSTICK_CY = HEIGHT - JOYSTICK_MARGIN - JOYSTICK_BASE_RADIUS;

        let joystickTouchId = null;
        let joystickMouseDown = false;
        let joystickKnobX = JOYSTICK_CX;
        let joystickKnobY = JOYSTICK_CY;
        let joystickDirX = 0;
        let joystickDirY = 0;
        let joystickMagnitude = 0;

        // -------- ВИЗУАЛЬНАЯ КНОПКА СМЕНЫ РЕЖИМА --------
        const CTRL_BTN_W = 280;
        const CTRL_BTN_H = 68;
        const CTRL_BTN_X = WIDTH - 16 - CTRL_BTN_W;
        const CTRL_BTN_Y = 16;
        let ctrlBtnPressed = false;

        function isOnCtrlButton(x, y) {
            return x >= CTRL_BTN_X && x <= CTRL_BTN_X + CTRL_BTN_W &&
                   y >= CTRL_BTN_Y && y <= CTRL_BTN_Y + CTRL_BTN_H;
        }

        function cycleControlMode() {
            controlModeIndex = (controlModeIndex + 1) % CONTROL_MODES.length;
            controlMode = CONTROL_MODES[controlModeIndex];

            if (controlMode !== "touch") {
                joystickTouchId = null;
                joystickMouseDown = false;
                resetJoystick();
            }
        }

        function getModeText() {
            if (controlMode === "keyboard") return "WASD";
            if (controlMode === "mouse") return "МЫШЬ";
            return "ДЖОЙСТИК";
        }

        function getModeColor() {
            if (controlMode === "keyboard") return "rgb(160, 220, 180)";
            if (controlMode === "mouse") return "rgb(160, 200, 255)";
            return "rgb(255, 200, 130)";
        }

        function isInJoystickZone(x, y) {
            const dx = x - JOYSTICK_CX;
            const dy = y - JOYSTICK_CY;
            return (dx * dx + dy * dy) <= JOYSTICK_GRAB_RADIUS * JOYSTICK_GRAB_RADIUS;
        }

        function setJoystickFromPoint(x, y) {
            const rawDx = x - JOYSTICK_CX;
            const rawDy = y - JOYSTICK_CY;
            const rawDist = Math.sqrt(rawDx * rawDx + rawDy * rawDy);

            if (rawDist < 0.001) {
                resetJoystick();
                return;
            }

            const dirX = rawDx / rawDist;
            const dirY = rawDy / rawDist;
            const clampedDist = Math.min(rawDist, JOYSTICK_MAX_DIST);

            joystickKnobX = JOYSTICK_CX + dirX * clampedDist;
            joystickKnobY = JOYSTICK_CY + dirY * clampedDist;
            joystickDirX = dirX;
            joystickDirY = dirY;
            joystickMagnitude = Math.min(1, rawDist / JOYSTICK_MAX_DIST);
        }

        function resetJoystick() {
            joystickKnobX = JOYSTICK_CX;
            joystickKnobY = JOYSTICK_CY;
            joystickDirX = 0;
            joystickDirY = 0;
            joystickMagnitude = 0;
        }

        let px = WIDTH / 2;
        let py = HEIGHT / 2;

        const keys = {};
        const enemies = [];
        const triangles = [];
        const planes = [];
        const explosions = [];
        const skidMarks = [];

        let spawnTimer = 0;
        let speedupTimer = 0;
        let triangleSpawnTimer = 0;
        let planeSpawnTimer = 0;
        let isDead = false;

        // -------- СЧЁТ --------
        let score = 0;
        let bestScore = Number(localStorage.getItem("bestScore") || 0);
        let scoreTimer = 0;
        const SCORE_PER_SECOND = 10;

        // -------- МЯГКИЙ СБРОС --------
        function softReset() {
            enemies.length = 0;
            triangles.length = 0;
            planes.length = 0;
            explosions.length = 0;
            skidMarks.length = 0;

            px = WIDTH / 2;
            py = HEIGHT / 2;

            spawnTimer = 0;
            speedupTimer = 0;
            triangleSpawnTimer = 0;
            planeSpawnTimer = 0;

            SPAWN_INTERVAL = SPAWN_INTERVAL_INIT;

            scoreTimer = 0;
            isDead = false;

            joystickTouchId = null;
            joystickMouseDown = false;
            resetJoystick();
        }

        function restartGame() {
            location.reload();
        }

        // -------- КЛАВИАТУРА --------
        window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;

            if (k === "r" || k === "к") {
                softReset();
            }
            if (k === "q" || k === "й") {
                cycleControlMode();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // -------- КООРДИНАТЫ --------
        function canvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = WIDTH / rect.width;
            const scaleY = HEIGHT / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
            };
        }

        function updateMouse(e) {
            const p = canvasCoords(e.clientX, e.clientY);
            mouseX = Math.max(0, Math.min(WIDTH, p.x));
            mouseY = Math.max(0, Math.min(HEIGHT, p.y));
        }

        canvas.addEventListener("mousemove", updateMouse);

        // -------- МЫШЬ --------
        canvas.addEventListener("mousedown", (e) => {
            updateMouse(e);
            const p = canvasCoords(e.clientX, e.clientY);

            if (isOnCtrlButton(p.x, p.y)) {
                ctrlBtnPressed = true;
                return;
            }

            if (controlMode === "touch" && isInJoystickZone(p.x, p.y)) {
                joystickMouseDown = true;
                setJoystickFromPoint(p.x, p.y);
            }
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!joystickMouseDown) return;
            const p = canvasCoords(e.clientX, e.clientY);
            setJoystickFromPoint(p.x, p.y);
        });

        window.addEventListener("mouseup", () => {
            if (ctrlBtnPressed) {
                ctrlBtnPressed = false;
                cycleControlMode();
            }
            if (joystickMouseDown) {
                joystickMouseDown = false;
                resetJoystick();
            }
        });

        // -------- КАСАНИЯ --------
        function touchToCanvas(touch) {
            return canvasCoords(touch.clientX, touch.clientY);
        }

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const pos = touchToCanvas(t);

                if (isOnCtrlButton(pos.x, pos.y)) {
                    cycleControlMode();
                    continue;
                }

                if (controlMode === "touch" && joystickTouchId === null && isInJoystickZone(pos.x, pos.y)) {
                    joystickTouchId = t.identifier;
                    setJoystickFromPoint(pos.x, pos.y);
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    const pos = touchToCanvas(t);
                    setJoystickFromPoint(pos.x, pos.y);
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    resetJoystick();
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchcancel", (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    resetJoystick();
                }
            }
        });

        document.getElementById("restartBtn").addEventListener("click", restartGame);

        // -------- РИСОВАНИЕ ТРЕУГОЛЬНИКА --------
        function drawTriangle(x, y, angle, fillStyle) {
            const r = TRIANGLE_SIZE;
            const h = r * Math.sqrt(3) / 2;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(-r / 2, -h);
            ctx.lineTo(-r / 2, h);
            ctx.closePath();

            ctx.fillStyle = fillStyle;
            ctx.fill();

            ctx.restore();
        }

        // -------- РИСОВАНИЕ РАКЕТЫ --------
        function drawPlane(x, y, angle, fillStyle) {
            const s = PLANE_SIZE;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(s, 0);
            ctx.lineTo(-s * 0.3, -s * 0.25);
            ctx.lineTo(-s * 0.3, -s * 0.9);
            ctx.lineTo(-s * 0.7, -s * 0.9);
            ctx.lineTo(-s * 0.7, -s * 0.25);
            ctx.lineTo(-s, -s * 0.25);
            ctx.lineTo(-s, s * 0.25);
            ctx.lineTo(-s * 0.7, s * 0.25);
            ctx.lineTo(-s * 0.7, s * 0.9);
            ctx.lineTo(-s * 0.3, s * 0.9);
            ctx.lineTo(-s * 0.3, s * 0.25);
            ctx.closePath();

            ctx.fillStyle = fillStyle;
            ctx.fill();

            ctx.restore();
        }

        // -------- РИСОВАНИЕ ДЖОЙСТИКА --------
        function drawJoystick() {
            const active = joystickTouchId !== null || joystickMouseDown;

            ctx.beginPath();
            ctx.arc(JOYSTICK_CX, JOYSTICK_CY, JOYSTICK_BASE_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(60, 100, 160, 0.25)";
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(120, 170, 230, 0.55)";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(JOYSTICK_CX, JOYSTICK_CY, JOYSTICK_BASE_RADIUS * 0.5, 0, Math.PI * 2);
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(120, 170, 230, 0.25)";
            ctx.stroke();

            if (joystickMagnitude > 0.05) {
                ctx.beginPath();
                ctx.moveTo(JOYSTICK_CX, JOYSTICK_CY);
                ctx.lineTo(joystickKnobX, joystickKnobY);
                ctx.lineWidth = 4;
                ctx.strokeStyle = active
                    ? "rgba(180, 220, 255, 0.7)"
                    : "rgba(150, 200, 255, 0.35)";
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(joystickKnobX, joystickKnobY, JOYSTICK_KNOB_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = active
                ? "rgba(120, 200, 255, 0.65)"
                : "rgba(90, 150, 220, 0.45)";
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = active
                ? "rgba(220, 240, 255, 0.95)"
                : "rgba(140, 190, 240, 0.7)";
            ctx.stroke();

            if (joystickMagnitude > 0.1) {
                const dotX = joystickKnobX + joystickDirX * 18;
                const dotY = joystickKnobY + joystickDirY * 18;
                ctx.beginPath();
                ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.fill();
            }
        }

        // -------- РИСОВАНИЕ КНОПКИ СМЕНЫ РЕЖИМА --------
        function drawCtrlButton(now) {
            const modeText = getModeText();
            const modeColor = getModeColor();
            const pressed = ctrlBtnPressed;

            const glow = 0.5 + 0.5 * Math.sin(now / 400);

            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(CTRL_BTN_X, CTRL_BTN_Y, CTRL_BTN_W, CTRL_BTN_H, 12);
            } else {
                ctx.rect(CTRL_BTN_X, CTRL_BTN_Y, CTRL_BTN_W, CTRL_BTN_H);
            }

            if (pressed) {
                ctx.fillStyle = "rgba(90, 150, 220, 0.9)";
            } else {
                ctx.fillStyle = "rgba(30, 55, 100, 0.65)";
            }
            ctx.fill();

            ctx.lineWidth = 2;
            if (pressed) {
                ctx.strokeStyle = "rgba(220, 240, 255, 1)";
            } else {
                const r = 80 + Math.round(40 * glow);
                const g = 140 + Math.round(50 * glow);
                const b = 200 + Math.round(40 * glow);
                ctx.strokeStyle = "rgba(" + r + ", " + g + ", " + b + ", 0.9)";
            }
            ctx.stroke();

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = modeColor;
            ctx.font = "bold 22px sans-serif";
            ctx.fillText("Управление: " + modeText, CTRL_BTN_X + CTRL_BTN_W / 2, CTRL_BTN_Y + 24);

            ctx.fillStyle = "rgba(200, 220, 245, 0.75)";
            ctx.font = "13px sans-serif";
            ctx.fillText("Нажми, чтобы сменить (или Q)", CTRL_BTN_X + CTRL_BTN_W / 2, CTRL_BTN_Y + 48);

            ctx.textAlign = "left";
            ctx.textBaseline = "top";
        }

        // -------- СПАВН ЖЁЛТОГО ШАРА --------
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let ex, ey;

            if (side === 0) {
                ex = Math.random() * (WIDTH - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
                ey = ENEMY_RADIUS;
            } else if (side === 1) {
                ex = WIDTH - ENEMY_RADIUS;
                ey = Math.random() * (HEIGHT - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
            } else if (side === 2) {
                ex = Math.random() * (WIDTH - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
                ey = HEIGHT - ENEMY_RADIUS;
            } else {
                ex = ENEMY_RADIUS;
                ey = Math.random() * (HEIGHT - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
            }

            enemies.push({
                x: ex, y: ey,
                dx: 0, dy: 0,
                state: "warning",
                warningTimer: 0,
            });
        }

        // -------- СПАВН ТРЕУГОЛЬНИКА --------
        function spawnTriangle() {
            const side = Math.floor(Math.random() * 4);
            let tx, ty;

            if (side === 0) {
                tx = Math.random() * (WIDTH - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
                ty = TRIANGLE_SIZE;
            } else if (side === 1) {
                tx = WIDTH - TRIANGLE_SIZE;
                ty = Math.random() * (HEIGHT - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
            } else if (side === 2) {
                tx = Math.random() * (WIDTH - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
                ty = HEIGHT - TRIANGLE_SIZE;
            } else {
                tx = TRIANGLE_SIZE;
                ty = Math.random() * (HEIGHT - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
            }

            triangles.push({
                x: tx, y: ty,
                vx: 0, vy: 0,
                angle: 0,
                age: 0,
                state: "warning",
                warningTimer: 0,
                lastSkidX: tx,
                lastSkidY: ty,
            });
        }

        // -------- СПАВН РАКЕТЫ --------
        function spawnPlane() {
            const side = Math.floor(Math.random() * 4);
            let x, y;

            if (side === 0) {
                x = Math.random() * (WIDTH - 2 * PLANE_SIZE) + PLANE_SIZE;
                y = PLANE_SIZE;
            } else if (side === 1) {
                x = WIDTH - PLANE_SIZE;
                y = Math.random() * (HEIGHT - 2 * PLANE_SIZE) + PLANE_SIZE;
            } else if (side === 2) {
                x = Math.random() * (WIDTH - 2 * PLANE_SIZE) + PLANE_SIZE;
                y = HEIGHT - PLANE_SIZE;
            } else {
                x = PLANE_SIZE;
                y = Math.random() * (HEIGHT - 2 * PLANE_SIZE) + PLANE_SIZE;
            }

            const targetX = px;
            const targetY = py;

            let dx = targetX - x;
            let dy = targetY - y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            dx /= len;
            dy /= len;

            planes.push({
                x: x, y: y,
                dx: dx, dy: dy,
                angle: Math.atan2(dy, dx),
                traveled: 0,
                checkTimer: 0,
                checkInterval: PLANE_CHECK_MIN + Math.random() * (PLANE_CHECK_MAX - PLANE_CHECK_MIN),
            });
        }

        // -------- ИГРОВОЙ ЦИКЛ --------
        let lastTime = performance.now();

        function loop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (!isDead) {
                let dx = 0;
                let dy = 0;

                if (controlMode === "keyboard") {
                    if (keys["a"] || keys["ф"]) dx -= 1;
                    if (keys["d"] || keys["в"]) dx += 1;
                    if (keys["w"] || keys["ц"]) dy -= 1;
                    if (keys["s"] || keys["ы"]) dy += 1;

                    if (dx !== 0 && dy !== 0) {
                        const len = Math.sqrt(dx * dx + dy * dy);
                        dx /= len;
                        dy /= len;
                    }

                    px += dx * SPEED * dt;
                    py += dy * SPEED * dt;
                } else if (controlMode === "mouse") {
                    const mdx = mouseX - px;
                    const mdy = mouseY - py;
                    const dist = Math.sqrt(mdx * mdx + mdy * mdy);

                    if (dist > MOUSE_DEADZONE) {
                        const step = SPEED * dt;
                        if (step >= dist) {
                            px = mouseX;
                            py = mouseY;
                        } else {
                            px += (mdx / dist) * step;
                            py += (mdy / dist) * step;
                        }
                    }
                } else {
                    if (joystickMagnitude > JOYSTICK_DEADZONE &&
                        (joystickDirX !== 0 || joystickDirY !== 0)) {

                        if (JOYSTICK_ANALOG) {
                            const eff = Math.min(1, (joystickMagnitude - JOYSTICK_DEADZONE) / (1 - JOYSTICK_DEADZONE));
                            px += joystickDirX * SPEED * eff * dt;
                            py += joystickDirY * SPEED * eff * dt;
                        } else {
                            px += joystickDirX * SPEED * dt;
                            py += joystickDirY * SPEED * dt;
                        }
                    }
                }

                if (px < BALL_RADIUS) px = BALL_RADIUS;
                if (px > WIDTH - BALL_RADIUS) px = WIDTH - BALL_RADIUS;
                if (py < BALL_RADIUS) py = BALL_RADIUS;
                if (py > HEIGHT - BALL_RADIUS) py = HEIGHT - BALL_RADIUS;

                scoreTimer += dt;
                if (scoreTimer >= 1) {
                    scoreTimer -= 1;
                    score += SCORE_PER_SECOND;
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem("bestScore", bestScore);
                    }
                }

                speedupTimer += dt;
                if (speedupTimer >= SPEEDUP_EVERY) {
                    speedupTimer -= SPEEDUP_EVERY;
                    SPAWN_INTERVAL = Math.max(SPAWN_MIN, SPAWN_INTERVAL * SPEEDUP_FACTOR);
                }

                spawnTimer += dt;
                if (spawnTimer >= SPAWN_INTERVAL) {
                    spawnTimer -= SPAWN_INTERVAL;
                    spawnEnemy();
                }

                triangleSpawnTimer += dt;
                if (triangleSpawnTimer >= TRIANGLE_SPAWN_INTERVAL) {
                    triangleSpawnTimer -= TRIANGLE_SPAWN_INTERVAL;
                    spawnTriangle();
                }

                planeSpawnTimer += dt;
                if (planeSpawnTimer >= PLANE_SPAWN_INTERVAL) {
                    planeSpawnTimer -= PLANE_SPAWN_INTERVAL;
                    spawnPlane();
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];

                    if (e.state === "warning") {
                        e.warningTimer += dt;
                        if (e.warningTimer >= WARNING_TIME) {
                            let ddx = px - e.x;
                            let ddy = py - e.y;
                            const len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
                            e.dx = ddx / len;
                            e.dy = ddy / len;
                            e.state = "attack";
                        }
                    } else {
                        e.x += e.dx * ENEMY_SPEED * dt;
                        e.y += e.dy * ENEMY_SPEED * dt;

                        if (
                            e.x < -ENEMY_RADIUS ||
                            e.x > WIDTH + ENEMY_RADIUS ||
                            e.y < -ENEMY_RADIUS ||
                            e.y > HEIGHT + ENEMY_RADIUS
                        ) {
                            enemies.splice(i, 1);
                            continue;
                        }

                        const ddx = e.x - px;
                        const ddy = e.y - py;
                        const dist = Math.sqrt(ddx * ddx + ddy * ddy);
                        if (dist < ENEMY_RADIUS + BALL_RADIUS) {
                            isDead = true;
                            enemies.length = 0;
                            triangles.length = 0;
                            planes.length = 0;
                            break;
                        }
                    }
                }

                if (!isDead) {
                    for (let i = triangles.length - 1; i >= 0; i--) {
                        const t = triangles[i];

                        if (t.state === "warning") {
                            t.warningTimer += dt;
                            const adx = px - t.x;
                            const ady = py - t.y;
                            const targetAngle = Math.atan2(ady, adx);
                            let diff = targetAngle - t.angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            t.angle += diff * Math.min(1, TRIANGLE_TURN_RATE * dt);

                            if (t.warningTimer >= TRIANGLE_WARNING_TIME) {
                                t.state = "attack";
                                t.age = 0;
                            }
                            continue;
                        }

                        t.age += dt;

                        if (t.age >= TRIANGLE_LIFETIME) {
                            explosions.push({
                                x: t.x, y: t.y, t: 0,
                                duration: 0.45,
                                maxRadius: 42,
                                killsPlayer: false,
                            });
                            triangles.splice(i, 1);
                            continue;
                        }

                        const ddx = px - t.x;
                        const ddy = py - t.y;
                        const targetAngle = Math.atan2(ddy, ddx);

                        let diff = targetAngle - t.angle;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        const maxTurn = TRIANGLE_TURN_RATE * dt;
                        if (Math.abs(diff) > maxTurn) {
                            t.angle += Math.sign(diff) * maxTurn;
                        } else {
                            t.angle = targetAngle;
                        }

                        const idealVx = Math.cos(t.angle) * TRIANGLE_SPEED;
                        const idealVy = Math.sin(t.angle) * TRIANGLE_SPEED;

                        const grip = Math.min(1, TRIANGLE_GRIP * dt);
                        t.vx += (idealVx - t.vx) * grip;
                        t.vy += (idealVy - t.vy) * grip;

                        t.x += t.vx * dt;
                        t.y += t.vy * dt;

                        const velocityAngle = Math.atan2(t.vy, t.vx);
                        let driftDiff = velocityAngle - t.angle;
                        while (driftDiff > Math.PI) driftDiff -= Math.PI * 2;
                        while (driftDiff < -Math.PI) driftDiff += Math.PI * 2;
                        const driftAmount = Math.abs(driftDiff);

                        const currentSpeed = Math.sqrt(t.vx * t.vx + t.vy * t.vy);
                        if (driftAmount > DRIFT_THRESHOLD && currentSpeed > 60) {
                            const skidDx = t.x - t.lastSkidX;
                            const skidDy = t.y - t.lastSkidY;
                            const skidDist = Math.sqrt(skidDx * skidDx + skidDy * skidDy);

                            if (skidDist > 6) {
                                const perpX = Math.cos(t.angle + Math.PI / 2) * TRIANGLE_SIZE * 0.7;
                                const perpY = Math.sin(t.angle + Math.PI / 2) * TRIANGLE_SIZE * 0.7;

                                skidMarks.push({
                                    x: t.x - perpX, y: t.y - perpY,
                                    t: 0, life: 0.9,
                                    intensity: Math.min(1, (driftAmount - DRIFT_THRESHOLD) * 2),
                                });
                                skidMarks.push({
                                    x: t.x + perpX, y: t.y + perpY,
                                    t: 0, life: 0.9,
                                    intensity: Math.min(1, (driftAmount - DRIFT_THRESHOLD) * 2),
                                });

                                t.lastSkidX = t.x;
                                t.lastSkidY = t.y;
                            }
                        } else {
                            t.lastSkidX = t.x;
                            t.lastSkidY = t.y;
                        }

                        const distToPlayer = Math.sqrt(
                            (t.x - px) * (t.x - px) + (t.y - py) * (t.y - py)
                        );
                        if (distToPlayer < TRIANGLE_SIZE * 0.7 + BALL_RADIUS) {
                            isDead = true;
                            enemies.length = 0;
                            triangles.length = 0;
                            planes.length = 0;
                            break;
                        }
                    }
                }

                if (!isDead) {
                    for (let i = planes.length - 1; i >= 0; i--) {
                        const p = planes[i];

                        p.x += p.dx * PLANE_SPEED * dt;
                        p.y += p.dy * PLANE_SPEED * dt;
                        p.traveled += PLANE_SPEED * dt;

                        if (p.traveled > PLANE_MAX_PATH) {
                            planes.splice(i, 1);
                            continue;
                        }

                        p.checkTimer += dt;
                        if (p.checkTimer >= p.checkInterval) {
                            p.checkTimer = 0;
                            p.checkInterval = PLANE_CHECK_MIN + Math.random() * (PLANE_CHECK_MAX - PLANE_CHECK_MIN);

                            const ddx = px - p.x;
                            const ddy = py - p.y;
                            const dist = Math.sqrt(ddx * ddx + ddy * ddy);

                            if (dist < PLANE_EXPLOSION_RADIUS) {
                                explosions.push({
                                    x: p.x, y: p.y, t: 0,
                                    duration: 0.7,
                                    maxRadius: PLANE_EXPLOSION_RADIUS * 2,
                                    lethalRadius: PLANE_EXPLOSION_RADIUS,
                                    killsPlayer: true,
                                });
                                planes.splice(i, 1);
                                continue;
                            }
                        }
                    }
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.t += dt;

                if (ex.killsPlayer && !isDead) {
                    const ddx = px - ex.x;
                    const ddy = py - ex.y;
                    const dist = Math.sqrt(ddx * ddx + ddy * ddy);
                    if (dist < ex.lethalRadius) {
                        isDead = true;
                        enemies.length = 0;
                        triangles.length = 0;
                        planes.length = 0;
                    }
                }

                if (ex.t >= ex.duration) explosions.splice(i, 1);
            }

            for (let i = skidMarks.length - 1; i >= 0; i--) {
                const s = skidMarks[i];
                s.t += dt;
                if (s.t >= s.life) skidMarks.splice(i, 1);
            }

            // -------- ОТРИСОВКА --------
            ctx.fillStyle = "rgb(10, 15, 40)";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            if (controlMode === "mouse" && !isDead) {
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 6, 0, Math.PI * 2);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "rgba(120, 200, 255, 0.7)";
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(mouseX - 10, mouseY);
                ctx.lineTo(mouseX - 3, mouseY);
                ctx.moveTo(mouseX + 3, mouseY);
                ctx.lineTo(mouseX + 10, mouseY);
                ctx.moveTo(mouseX, mouseY - 10);
                ctx.lineTo(mouseX, mouseY - 3);
                ctx.moveTo(mouseX, mouseY + 3);
                ctx.lineTo(mouseX, mouseY + 10);
                ctx.strokeStyle = "rgba(120, 200, 255, 0.5)";
                ctx.stroke();
            }

            for (const s of skidMarks) {
                const p = s.t / s.life;
                const alpha = (1 - p) * 0.55 * s.intensity;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 2.5 + p * 2, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 130, 50, " + alpha + ")";
                ctx.fill();
            }

            for (const e of enemies) {
                if (e.state === "warning") {
                    const tt = e.warningTimer / WARNING_TIME;
                    const pulse = 0.5 + 0.5 * Math.sin(e.warningTimer * 30);
                    const ringRadius = ENEMY_RADIUS + (1 - tt) * 14;

                    ctx.beginPath();
                    ctx.arc(e.x, e.y, ringRadius, 0, Math.PI * 2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(250, 220, 60, " + (0.4 + 0.4 * pulse) + ")";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(250, 220, 60, " + (0.35 + 0.3 * pulse) + ")";
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = "rgb(250, 220, 60)";
                    ctx.fill();
                }
            }

            for (const t of triangles) {
                if (t.state === "warning") {
                    const tt = t.warningTimer / TRIANGLE_WARNING_TIME;
                    const pulse = 0.5 + 0.5 * Math.sin(t.warningTimer * 30);
                    const ringRadius = TRIANGLE_SIZE + (1 - tt) * 14;

                    ctx.beginPath();
                    ctx.arc(t.x, t.y, ringRadius, 0, Math.PI * 2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(255, 140, 40, " + (0.4 + 0.4 * pulse) + ")";
                    ctx.stroke();

                    ctx.globalAlpha = 0.35 + 0.3 * pulse;
                    drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);
                    ctx.globalAlpha = 1;
                    continue;
                }

                drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);

                const lifeLeft = 1 - t.age / TRIANGLE_LIFETIME;
                const blinkRate = 6 + (1 - lifeLeft) * 20;
                const blinkAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t.age * blinkRate));
                ctx.beginPath();
                ctx.arc(t.x, t.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 200, " + blinkAlpha + ")";
                ctx.fill();
            }

            for (const p of planes) {
                drawPlane(p.x, p.y, p.angle, "rgb(240, 240, 250)");

                const pulse = 0.4 + 0.3 * Math.sin(now / 100 + p.x);
                ctx.beginPath();
                ctx.arc(p.x, p.y, PLANE_SIZE * 0.9, 0, Math.PI * 2);
                ctx.lineWidth = 1;
                ctx.strokeStyle = "rgba(220, 220, 255, " + pulse + ")";
                ctx.stroke();
            }

            for (const ex of explosions) {
                const prog = ex.t / ex.duration;
                const radius = 8 + prog * (ex.maxRadius - 8);
                const alpha = 1 - prog;

                if (ex.killsPlayer) {
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, radius, 0, Math.PI * 2);
                    ctx.lineWidth = 3 * (1 - prog) + 1.5;
                    ctx.strokeStyle = "rgba(255, 200, 100, " + alpha + ")";
                    ctx.stroke();

                    const lethalAlpha = Math.max(0, 1 - prog * 1.6);
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 80, 40, " + (lethalAlpha * 0.45) + ")";
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI * 2);
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = "rgba(255, 120, 60, " + (lethalAlpha * 0.9) + ")";
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, radius, 0, Math.PI * 2);
                    ctx.lineWidth = 3 * (1 - prog) + 1;
                    ctx.strokeStyle = "rgba(255, 170, 60, " + alpha + ")";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, radius * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 220, 120, " + (alpha * 0.6) + ")";
                    ctx.fill();
                }
            }

            if (!isDead) {
                ctx.beginPath();
                ctx.arc(px, py, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = "rgb(80, 230, 120)";
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgb(180, 255, 200)";
                ctx.stroke();
            }

            if (controlMode === "touch" && !isDead) {
                drawJoystick();
            }

            // -------- HUD --------
            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            ctx.fillStyle = "rgb(230, 245, 255)";
            ctx.font = "bold 28px sans-serif";
            ctx.fillText("Счёт: " + score, 16, 16);

            ctx.fillStyle = "rgb(160, 200, 240)";
            ctx.font = "18px sans-serif";
            ctx.fillText("Лучший счёт: " + bestScore, 16, 52);

            ctx.fillStyle = "rgb(120, 150, 190)";
            ctx.font = "14px sans-serif";
            ctx.fillText("Спавн шаров: " + SPAWN_INTERVAL.toFixed(2) + " с", 16, 82);
            ctx.fillText("Треугольников: " + triangles.length, 16, 102);
            ctx.fillText("Ракет: " + planes.length, 16, 120);

            ctx.fillStyle = "rgba(180, 210, 240, 0.85)";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText("R — сброс уровня (без перезагрузки)", 16, 146);

            drawCtrlButton(now);

            if (isDead) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.fillStyle = "rgb(255, 80, 80)";
                ctx.font = "bold 64px sans-serif";
                ctx.fillText("GAME OVER", WIDTH / 2, HEIGHT / 2 - 100);

                ctx.fillStyle = "rgb(230, 245, 255)";
                ctx.font = "32px sans-serif";
                ctx.fillText("Твой счёт: " + score, WIDTH / 2, HEIGHT / 2 - 20);

                ctx.fillStyle = "rgb(180, 220, 255)";
                ctx.font = "26px sans-serif";
                ctx.fillText("Лучший счёт: " + bestScore, WIDTH / 2, HEIGHT / 2 + 30);

                if (score >= bestScore && score > 0) {
                    ctx.fillStyle = "rgb(255, 220, 80)";
                    ctx.font = "bold 22px sans-serif";
                    ctx.fillText("★ НОВЫЙ РЕКОРД ★", WIDTH / 2, HEIGHT / 2 + 75);
                }

                ctx.fillStyle = "rgb(200, 200, 220)";
                ctx.font = "22px sans-serif";
                ctx.fillText("Нажми R чтобы сбросить уровень", WIDTH / 2, HEIGHT / 2 + 130);
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
