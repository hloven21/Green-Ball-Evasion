let leaderboardCache = null;
let leaderboardCacheTime = 0;
const LEADERBOARD_CACHE_MS = 5000;

async function loadLeaderboard(forceRefresh) {
  if (!supabaseClient) return [];
  const now = Date.now();
  if (!forceRefresh && leaderboardCache && (now - leaderboardCacheTime) < LEADERBOARD_CACHE_MS) {
    return leaderboardCache;
  }
  try {
    const { data, error } = await supabaseClient
      .from('leaderboard')
      .select('nickname, score, difficulty, created_at')
      .order('score', { ascending: false })
      .limit(50);
    if (error) throw error;
    leaderboardCache = (data || []).map(row => ({
      nick: row.nickname, score: row.score,
      difficulty: row.difficulty, date: row.created_at
    }));
    leaderboardCacheTime = now;
    return leaderboardCache;
  } catch (e) {
    console.error("Ошибка загрузки лидерборда:", e);
    return leaderboardCache || [];
  }
}

async function saveScoreToSupabase(nick, score, difficulty) {
  if (!supabaseClient || !nick || score <= 0) return;
  try {
    const { data: existing, error: selectError } = await supabaseClient
      .from('leaderboard')
      .select('id, score')
      .eq('nickname', nick)
      .order('score', { ascending: false })
      .limit(1);
    if (selectError) throw selectError;

    if (!existing || existing.length === 0) {
      const { error } = await supabaseClient
        .from('leaderboard')
        .insert([{ nickname: nick, score: score, difficulty: difficulty }]);
      if (error) throw error;
    } else if (score > existing[0].score) {
      const { error } = await supabaseClient
        .from('leaderboard')
        .update({ score: score, difficulty: difficulty })
        .eq('id', existing[0].id);
      if (error) throw error;
    }
    leaderboardCache = null;
  } catch (e) { console.error("Ошибка сохранения счёта:", e); }
}

const SHOP_COLS = 4;

const SHOP_GRID_W = SHOP_COLS * SHOP_CELL - SHOP_GAP;
const SHOP_ROWS = Math.ceil(SKINS.length / SHOP_COLS);

function getSkinCellPos(index) {
  const col = index % SHOP_COLS;
  const row = Math.floor(index / SHOP_COLS);
  return {
    cx: SHOP_GRID_X + col * SHOP_CELL + SHOP_RADIUS,
    cy: SHOP_GRID_Y + row * SHOP_CELL + SHOP_RADIUS
  };
}
function getSkinAt(x, y) {
  for (let i = 0; i < SKINS.length; i++) {
    const p = getSkinCellPos(i);
    const dx = x - p.cx, dy = y - p.cy;
    if (dx * dx + dy * dy <= SHOP_RADIUS * SHOP_RADIUS) return i;
  }
  return -1;
}

function isInJoystickZone(x, y) {
  const dx = x - JOYSTICK_CX;
  const dy = y - JOYSTICK_CY;
  return (dx * dx + dy * dy) <= JOYSTICK_GRAB_RADIUS * JOYSTICK_GRAB_RADIUS;
}
function setJoystickFromPoint(x, y) {
  const rawDx = x - JOYSTICK_CX;
  const rawDy = y - JOYSTICK_CY;
  const rawDist = Math.sqrt(rawDx * rawDx + rawDy * rawDy);
  if (rawDist < 0.001) { resetJoystick(); return; }
  const dirX = rawDx / rawDist;
  const dirY = rawDy / rawDist;
  const clampedDist = Math.min(rawDist, JOYSTICK_MAX_DIST);
  joystickKnobX = JOYSTICK_CX + dirX * clampedDist;
  joystickKnobY = JOYSTICK_CY + dirY * clampedDist;
  joystickDirX = dirX;
  joystickDirY = dirY;
  joystickMagnitude = Math.min(1, rawDist / JOYSTICK_MAX_DIST);
}

  joystickKnobX = JOYSTICK_CX;
  joystickKnobY = JOYSTICK_CY;
  joystickDirX = 0;

}

function getActiveMenuButtons() {
  if (menuState === "main") return getMainMenuButtons();
  if (menuState === "play_menu") return getPlayMenuButtons();
  if (menuState === "levels") return getLevelsMenuButtons();
  if (menuState === "leaderboard") return getLeaderboardButtons();
  if (menuState === "shop") return getShopButtons();
  return [];
}

function dispatchMenuAction(id) {
  if (id === "play") {
    menuState = "play_menu";
  } else if (id === "levels") {
    menuState = "levels";
  } else if (id.startsWith("level_")) {
    const num = parseInt(id.replace("level_", ""), 10);
    location.href = "parkour.html?level=" + num;
  } else if (id === "shop") {
    menuState = "shop";
  } else if (id === "leaders") {
    if (!nickname) {
      showNickInput(() => { menuState = "leaderboard"; });
    } else {
      menuState = "leaderboard";
    }
    leaderboardCache = null;
  } else if (id === "endless") {
    softReset();
    menuState = "game";
    updateRestartBtnVisibility();
  } else if (id === "back") {
    menuState = "main";
  }
}
function handleMenuClick(x, y) {
  const buttons = getActiveMenuButtons();
  for (const b of buttons) {
    if (b.disabled) continue;
    if (isInRect(x, y, b)) { dispatchMenuAction(b.id); return true; }
  }
  return false;
}
function goToMainMenu() {
  menuState = "main";
  infoOpen = false;
  updateRestartBtnVisibility();
}

function softReset() {
  enemies.length = 0; triangles.length = 0; planes.length = 0;
  explosions.length = 0; skidMarks.length = 0;
  px = WIDTH / 2; py = HEIGHT / 2;
  spawnTimer = 0; speedupTimer = 0;
  triangleSpawnTimer = 0; planeSpawnTimer = 0;
  SPAWN_INTERVAL = SPAWN_INTERVAL_INIT;
  score = 0; scoreTimer = 0;
  isDead = false; scoreSavedThisLife = false;
  coinsEarnedThisLife = 0;
  joystickTouchId = null; joystickMouseDown = false;
  resetJoystick();
}
function restartGame() { location.reload(); }

function setDifficulty(newDiff) {
  if (newDiff === difficulty) return;
  difficulty = newDiff;
  localStorage.setItem("difficulty", difficulty);
  applyDifficulty();
  bestScore = Number(localStorage.getItem(bestScoreKey(difficulty)) || 0);
  score = 0;
  softReset();
}

window.addEventListener("keydown", (e) => {
  if (nickOverlay.classList.contains("show")) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "escape") {
    if (infoOpen) { infoOpen = false; return; }
    if (menuState === "game") { goToMainMenu(); return; }
    if (menuState === "play_menu" || menuState === "leaderboard" ||
        menuState === "shop" || menuState === "levels") {
      menuState = "main"; return;
    }
    return;
  }
  if (menuState !== "game") return;
  if (infoOpen) return;
  if (k === "r" || k === "к") { softReset(); }
  if (k === "q" || k === "й") { cycleControlMode(); }
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = WIDTH / rect.width;
  const scaleY = HEIGHT / rect.height;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}
function updateMouse(e) {
  const p = canvasCoords(e.clientX, e.clientY);
  mouseX = Math.max(0, Math.min(WIDTH, p.x));
  mouseY = Math.max(0, Math.min(HEIGHT, p.y));
}
canvas.addEventListener("mousemove", updateMouse);

canvas.addEventListener("mousedown", (e) => {
  if (nickOverlay.classList.contains("show")) return;
  updateMouse(e);
  const p = canvasCoords(e.clientX, e.clientY);
  if (menuState !== "game") {
    if (menuState === "shop") {
      const skinIdx = getSkinAt(p.x, p.y);
      if (skinIdx >= 0) { handleSkinClick(skinIdx); return; }
    }
    handleMenuClick(p.x, p.y);
    return;
  }
  if (infoOpen) {
    if (isOnInfoClose(p.x, p.y)) { infoCloseBtnPressed = true; return; }
    const diff = getDiffButtonAt(p.x, p.y);
    if (diff) { setDifficulty(diff); return; }
    if (!isOnInfoPanel(p.x, p.y)) { infoOpen = false; }
    return;
  }
  if (isOnCtrlButton(p.x, p.y)) { ctrlBtnPressed = true; return; }
  if (isOnInfoBtn(p.x, p.y)) { infoBtnPressed = true; return; }
  if (isOnMenuBtnGame(p.x, p.y)) { menuBtnPressed = true; return; }
  if (controlMode === "touch" && isInJoystickZone(p.x, p.y)) {
    joystickMouseDown = true;
    setJoystickFromPoint(p.x, p.y);
  }
});
canvas.addEventListener("mousemove", (e) => {
  if (menuState !== "game") return;
  if (infoOpen) return;
  if (!joystickMouseDown) return;
  const p = canvasCoords(e.clientX, e.clientY);
  setJoystickFromPoint(p.x, p.y);
});
window.addEventListener("mouseup", () => {
  if (infoCloseBtnPressed) { infoCloseBtnPressed = false; infoOpen = false; return; }
  if (infoBtnPressed) { infoBtnPressed = false; infoOpen = true; return; }
  if (menuBtnPressed) { menuBtnPressed = false; goToMainMenu(); return; }
  if (ctrlBtnPressed) { ctrlBtnPressed = false; cycleControlMode(); return; }
  if (joystickMouseDown) { joystickMouseDown = false; resetJoystick(); }
});

function touchToCanvas(touch) { return canvasCoords(touch.clientX, touch.clientY); }

canvas.addEventListener("touchstart", (e) => {
  if (nickOverlay.classList.contains("show")) return;
  enterFullscreenOnMobile();
  e.preventDefault();
  for (const t of e.changedTouches) {
    const pos = touchToCanvas(t);
    if (menuState !== "game") {
      if (menuState === "shop") {
        const skinIdx = getSkinAt(pos.x, pos.y);
        if (skinIdx >= 0) { handleSkinClick(skinIdx); continue; }
      }
      handleMenuClick(pos.x, pos.y);
      continue;
    }
    if (infoOpen) {
      if (isOnInfoClose(pos.x, pos.y)) { infoOpen = false; continue; }
      const diff = getDiffButtonAt(pos.x, pos.y);
      if (diff) { setDifficulty(diff); continue; }
      if (!isOnInfoPanel(pos.x, pos.y)) { infoOpen = false; }
      continue;
    }
    if (isOnMenuBtnGame(pos.x, pos.y)) { goToMainMenu(); continue; }
    if (isOnInfoBtn(pos.x, pos.y)) { infoOpen = true; continue; }
    if (isOnCtrlButton(pos.x, pos.y)) { cycleControlMode(); continue; }
    if (controlMode === "touch" && joystickTouchId === null && isInJoystickZone(pos.x, pos.y)) {
      joystickTouchId = t.identifier;
      setJoystickFromPoint(pos.x, pos.y);
    }
  }
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  if (nickOverlay.classList.contains("show")) return;
  e.preventDefault();
  if (menuState !== "game") return;
  if (infoOpen) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      const pos = touchToCanvas(t);
      setJoystickFromPoint(pos.x, pos.y);
    }
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) { joystickTouchId = null; resetJoystick(); }
  }
}, { passive: false });

canvas.addEventListener("touchcancel", (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) { joystickTouchId = null; resetJoystick(); }
  }
});

if (mobileDevice) {
  restartBtn.textContent = "↻ Сброс";
  restartBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (infoOpen) { infoOpen = false; return; }
    softReset();
  });
  restartBtn.addEventListener("touchstart", (e) => { e.stopPropagation(); }, { passive: true });
} else {
  restartBtn.textContent = "↻ Полная перезагрузка";
  restartBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (infoOpen) { infoOpen = false; return; }
    restartGame();
  });
}

function drawTriangle(x, y, angle, fillStyle) {
  const r = TRIANGLE_SIZE;
  const h = r * Math.sqrt(3) / 2;
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(-r / 2, -h); ctx.lineTo(-r / 2, h);
  ctx.closePath(); ctx.fillStyle = fillStyle; ctx.fill(); ctx.restore();
}
function drawPlane(x, y, angle, fillStyle) {
  const s = PLANE_SIZE;
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(s, 0);
  ctx.lineTo(-s * 0.3, -s * 0.25); ctx.lineTo(-s * 0.3, -s * 0.9);
  ctx.lineTo(-s * 0.7, -s * 0.9); ctx.lineTo(-s * 0.7, -s * 0.25);
  ctx.lineTo(-s, -s * 0.25); ctx.lineTo(-s, s * 0.25);
  ctx.lineTo(-s * 0.7, s * 0.25); ctx.lineTo(-s * 0.7, s * 0.9);
  ctx.lineTo(-s * 0.3, s * 0.9); ctx.lineTo(-s * 0.3, s * 0.25);
  ctx.closePath(); ctx.fillStyle = fillStyle; ctx.fill(); ctx.restore();
}
function drawIconCircle(x, y, r, color) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}
function drawIconTriangle(x, y, size, color) {
  const h = size * Math.sqrt(3) / 2;
  ctx.beginPath(); ctx.moveTo(x + size, y); ctx.lineTo(x - size / 2, y - h);
  ctx.lineTo(x - size / 2, y + h); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
}
function drawIconPlane(x, y, size, color) {
  const s = size;
  ctx.beginPath();
  ctx.moveTo(x + s, y);
  ctx.lineTo(x - s * 0.3, y - s * 0.25); ctx.lineTo(x - s * 0.3, y - s * 0.9);
  ctx.lineTo(x - s * 0.7, y - s * 0.9); ctx.lineTo(x - s * 0.7, y - s * 0.25);
  ctx.lineTo(x - s, y - s * 0.25); ctx.lineTo(x - s, y + s * 0.25);
  ctx.lineTo(x - s * 0.7, y + s * 0.25); ctx.lineTo(x - s * 0.7, y + s * 0.9);
  ctx.lineTo(x - s * 0.3, y + s * 0.9); ctx.lineTo(x - s * 0.3, y + s * 0.25);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function drawCoinIcon(cx, cy, r) {
  const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  grad.addColorStop(0, "rgb(255, 245, 170)");
  grad.addColorStop(0.5, "rgb(255, 210, 70)");
  grad.addColorStop(1, "rgb(200, 140, 20)");
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.12); ctx.strokeStyle = "rgb(255, 240, 150)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.7, 0, Math.PI * 2);
  ctx.lineWidth = Math.max(1, r * 0.08); ctx.strokeStyle = "rgba(180, 120, 0, 0.6)"; ctx.stroke();
  ctx.fillStyle = "rgba(120, 80, 0, 0.85)";
  ctx.font = "bold " + Math.round(r * 1.4) + "px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("$", cx, cy + r * 0.05);
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}
function drawGear(cx, cy, outerR, innerR, teeth, holeR, fillStyle) {
  const steps = teeth * 4;
  const startOffset = -Math.PI / 2;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const angle = startOffset + (i / steps) * Math.PI * 2;
    const phase = i % 4;
    const r = (phase === 0 || phase === 1) ? outerR : innerR;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.moveTo(cx + holeR, cy); ctx.arc(cx, cy, holeR, 0, Math.PI * 2, true);
  ctx.fillStyle = fillStyle; ctx.fill();
}
function drawHamburger(cx, cy, size, color) {
  const w = size;
  const h = Math.max(2, size * 0.12);
  const gap = size * 0.28;
  ctx.fillStyle = color;
  ctx.fillRect(cx - w / 2, cy - gap - h / 2, w, h);
  ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
  ctx.fillRect(cx - w / 2, cy + gap - h / 2, w, h);
}
function drawJoystick() {
  const active = joystickTouchId !== null || joystickMouseDown;
  ctx.beginPath(); ctx.arc(JOYSTICK_CX, JOYSTICK_CY, JOYSTICK_BASE_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(60, 100, 160, 0.25)"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(120, 170, 230, 0.55)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(JOYSTICK_CX, JOYSTICK_CY, JOYSTICK_BASE_RADIUS * 0.5, 0, Math.PI * 2);
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(120, 170, 230, 0.25)"; ctx.stroke();
  if (joystickMagnitude > 0.05) {
    ctx.beginPath(); ctx.moveTo(JOYSTICK_CX, JOYSTICK_CY);
    ctx.lineTo(joystickKnobX, joystickKnobY);
    ctx.lineWidth = 4;
    ctx.strokeStyle = active ? "rgba(180, 220, 255, 0.7)" : "rgba(150, 200, 255, 0.35)";
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(joystickKnobX, joystickKnobY, JOYSTICK_KNOB_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = active ? "rgba(120, 200, 255, 0.65)" : "rgba(90, 150, 220, 0.45)";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = active ? "rgba(220, 240, 255, 0.95)" : "rgba(140, 190, 240, 0.7)";
  ctx.stroke();
  if (joystickMagnitude > 0.1) {
    const dotX = joystickKnobX + joystickDirX * 18;
    const dotY = joystickKnobY + joystickDirY * 18;
    ctx.beginPath(); ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)"; ctx.fill();
  }
}

function drawSkinCell(idx) {
  const skin = SKINS[idx];
  const p = getSkinCellPos(idx);
  const owned = ownedSkins.includes(idx);
  const equipped = selectedSkin === idx;
  const [r, g, b] = skin.rgb;

  const cardR = SHOP_RADIUS + 6;
  ctx.beginPath();
  ctx.arc(p.cx, p.cy, cardR, 0, Math.PI * 2);
  if (equipped) ctx.fillStyle = "rgba(255, 220, 80, 0.25)";
  else if (owned) ctx.fillStyle = "rgba(60, 110, 180, 0.35)";
  else ctx.fillStyle = "rgba(30, 45, 75, 0.4)";
  ctx.fill();

  const grad = ctx.createRadialGradient(
    p.cx - SHOP_RADIUS * 0.3, p.cy - SHOP_RADIUS * 0.3, SHOP_RADIUS * 0.15,
    p.cx, p.cy, SHOP_RADIUS
  );
  grad.addColorStop(0, "rgb(" + Math.min(255, r + 80) + ", " + Math.min(255, g + 80) + ", " + Math.min(255, b + 80) + ")");
  grad.addColorStop(0.5, "rgb(" + r + ", " + g + ", " + b + ")");
  grad.addColorStop(1, "rgb(" + Math.max(0, r - 60) + ", " + Math.max(0, g - 60) + ", " + Math.max(0, b - 60) + ")");

  ctx.beginPath();
  ctx.arc(p.cx, p.cy, SHOP_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grad; ctx.fill();

  ctx.lineWidth = equipped ? 3 : 2;
  if (equipped) ctx.strokeStyle = "rgb(255, 220, 80)";
  else if (owned) ctx.strokeStyle = "rgba(180, 220, 255, 0.7)";
  else ctx.strokeStyle = "rgba(120, 170, 230, 0.4)";
  ctx.stroke();

  if (owned) {
    ctx.beginPath();
    ctx.arc(p.cx - SHOP_RADIUS * 0.35, p.cy - SHOP_RADIUS * 0.35, SHOP_RADIUS * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.5)"; ctx.fill();
  }

  if (!owned) {
    ctx.beginPath();
    ctx.arc(p.cx, p.cy, SHOP_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)"; ctx.fill();
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.font = "bold " + Math.round(SHOP_RADIUS * 0.8) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("?", p.cx, p.cy + 2);
  }

  const labelY = p.cy + SHOP_RADIUS + 14;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (equipped) {
    ctx.fillStyle = "rgb(255, 220, 80)"; ctx.font = "bold 12px sans-serif";
    ctx.fillText("✓", p.cx, labelY);
  } else if (owned) {
    ctx.fillStyle = "rgba(180, 220, 255, 0.8)"; ctx.font = "12px sans-serif";
    ctx.fillText("✓", p.cx, labelY);
  } else {
    drawCoinIcon(p.cx - 12, labelY, 7);
    ctx.fillStyle = coins >= skin.cost ? "rgb(255, 220, 100)" : "rgba(255, 120, 120, 0.9)";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(String(skin.cost), p.cx - 2, labelY);
    ctx.textAlign = "center";
  }
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

// ===== СПАВН =====
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let ex, ey;
  if (side === 0) { ex = Math.random() * (WIDTH - 2 * ENEMY_RADIUS) + ENEMY_RADIUS; ey = ENEMY_RADIUS; }
  else if (side === 1) { ex = WIDTH - ENEMY_RADIUS; ey = Math.random() * (HEIGHT - 2 * ENEMY_RADIUS) + ENEMY_RADIUS; }
  else if (side === 2) { ex = Math.random() * (WIDTH - 2 * ENEMY_RADIUS) + ENEMY_RADIUS; ey = HEIGHT - ENEMY_RADIUS; }
  else { ex = ENEMY_RADIUS; ey = Math.random() * (HEIGHT - 2 * ENEMY_RADIUS) + ENEMY_RADIUS; }
  enemies.push({ x: ex, y: ey, dx: 0, dy: 0, state: "warning", warningTimer: 0 });
}
function spawnTriangle() {
  const side = Math.floor(Math.random() * 4);
  let tx, ty;
  if (side === 0) { tx = Math.random() * (WIDTH - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE; ty = TRIANGLE_SIZE; }
  else if (side === 1) { tx = WIDTH - TRIANGLE_SIZE; ty = Math.random() * (HEIGHT - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE; }
  else if (side === 2) { tx = Math.random() * (WIDTH - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE; ty = HEIGHT - TRIANGLE_SIZE; }
  else { tx = TRIANGLE_SIZE; ty = Math.random() * (HEIGHT - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE; }
  triangles.push({ x: tx, y: ty, vx: 0, vy: 0, angle: 0, age: 0, state: "warning", warningTimer: 0, lastSkidX: tx, lastSkidY: ty });
}
function spawnPlane() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * (WIDTH - 2 * PLANE_SIZE) + PLANE_SIZE; y = PLANE_SIZE; }
  else if (side === 1) { x = WIDTH - PLANE_SIZE; y = Math.random() * (HEIGHT - 2 * PLANE_SIZE) + PLANE_SIZE; }
  else if (side === 2) { x = Math.random() * (WIDTH - 2 * PLANE_SIZE) + PLANE_SIZE; y = HEIGHT - PLANE_SIZE; }
  else { x = PLANE_SIZE; y = Math.random() * (HEIGHT - 2 * PLANE_SIZE) + PLANE_SIZE; }
  const targetX = px, targetY = py;
  let dx = targetX - x, dy = targetY - y;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  dx /= len; dy /= len;
  planes.push({ x: x, y: y, dx: dx, dy: dy, angle: Math.atan2(dy, dx), traveled: 0, inZoneTimer: 0 });
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
let lastTime = performance.now();

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (menuState === "game") {
    if (!isDead && !infoOpen) {
      let dx = 0, dy = 0;
      if (controlMode === "keyboard") {
        if (keys["a"] || keys["ф"]) dx -= 1;
        if (keys["d"] || keys["в"]) dx += 1;
        if (keys["w"] || keys["ц"]) dy -= 1;
        if (keys["s"] || keys["ы"]) dy += 1;
        if (dx !== 0 && dy !== 0) {
          const len = Math.sqrt(dx * dx + dy * dy);
          dx /= len; dy /= len;
        }
        px += dx * SPEED * dt;
        py += dy * SPEED * dt;
      } else if (controlMode === "mouse") {
        const mdx = mouseX - px, mdy = mouseY - py;
        const dist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (dist > MOUSE_DEADZONE) {
          const step = SPEED * dt;
          if (step >= dist) { px = mouseX; py = mouseY; }
          else { px += (mdx / dist) * step; py += (mdy / dist) * step; }
        }
      } else {
        if (joystickMagnitude > JOYSTICK_DEADZONE && (joystickDirX !== 0 || joystickDirY !== 0)) {
          if (JOYSTICK_ANALOG) {
            const eff = Math.min(1, (joystickMagnitude - JOYSTICK_DEADZONE) / (1 - JOYSTICK_DEADZONE));
            px += joystickDirX * SPEED * eff * dt;
            py += joystickDirY * SPEED * eff * dt;
          } else {
            px += joystickDirX * SPEED * dt;
            py += joystickDirY * SPEED * dt;
          }
        }
      }
      if (px < BALL_RADIUS) px = BALL_RADIUS;
      if (px > WIDTH - BALL_RADIUS) px = WIDTH - BALL_RADIUS;
      if (py < BALL_RADIUS) py = BALL_RADIUS;
      if (py > HEIGHT - BALL_RADIUS) py = HEIGHT - BALL_RADIUS;

      scoreTimer += dt;
      if (scoreTimer >= 1) {
        scoreTimer -= 1;
        score += SCORE_PER_SECOND;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem(bestScoreKey(difficulty), bestScore);
        }
      }
      speedupTimer += dt;
      if (speedupTimer >= SPEEDUP_EVERY) {
        speedupTimer -= SPEEDUP_EVERY;
        SPAWN_INTERVAL = Math.max(SPAWN_MIN, SPAWN_INTERVAL * SPEEDUP_FACTOR);
      }
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INTERVAL) { spawnTimer -= SPAWN_INTERVAL; spawnEnemy(); }
      triangleSpawnTimer += dt;
      if (triangleSpawnTimer >= TRIANGLE_SPAWN_INTERVAL) { triangleSpawnTimer -= TRIANGLE_SPAWN_INTERVAL; spawnTriangle(); }
      planeSpawnTimer += dt;
      if (planeSpawnTimer >= PLANE_SPAWN_INTERVAL) { planeSpawnTimer -= PLANE_SPAWN_INTERVAL; spawnPlane(); }

      // Враги: жёлтые
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.state === "warning") {
          e.warningTimer += dt;
          if (e.warningTimer >= WARNING_TIME) {
            let ddx = px - e.x, ddy = py - e.y;
            const len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
            e.dx = ddx / len; e.dy = ddy / len;
            e.state = "attack";
          }
        } else {
          e.x += e.dx * ENEMY_SPEED * dt;
          e.y += e.dy * ENEMY_SPEED * dt;
          if (e.x < -ENEMY_RADIUS || e.x > WIDTH + ENEMY_RADIUS ||
              e.y < -ENEMY_RADIUS || e.y > HEIGHT + ENEMY_RADIUS) {
            enemies.splice(i, 1); continue;
          }
          const ddx = e.x - px, ddy = e.y - py;
          const dist = Math.sqrt(ddx * ddx + ddy * ddy);
          if (dist < ENEMY_RADIUS + BALL_RADIUS) {
            isDead = true;
            enemies.length = 0; triangles.length = 0; planes.length = 0;
            break;
          }
        }
      }

      // Треугольники
      if (!isDead) {
        for (let i = triangles.length - 1; i >= 0; i--) {
          const t = triangles[i];
          if (t.state === "warning") {
            t.warningTimer += dt;
            const adx = px - t.x, ady = py - t.y;
            const targetAngle = Math.atan2(ady, adx);
            let diff = targetAngle - t.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            t.angle += diff * Math.min(1, TRIANGLE_TURN_RATE * dt);
            if (t.warningTimer >= TRIANGLE_WARNING_TIME) { t.state = "attack"; t.age = 0; }
            continue;
          }
          t.age += dt;
          if (t.age >= TRIANGLE_LIFETIME) {
            explosions.push({ x: t.x, y: t.y, t: 0, duration: 0.45, maxRadius: 42, killsPlayer: false });
            triangles.splice(i, 1); continue;
          }
          const ddx = px - t.x, ddy = py - t.y;
          const targetAngle = Math.atan2(ddy, ddx);
          let diff = targetAngle - t.angle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const maxTurn = TRIANGLE_TURN_RATE * dt;
          if (Math.abs(diff) > maxTurn) t.angle += Math.sign(diff) * maxTurn;
          else t.angle = targetAngle;
          const idealVx = Math.cos(t.angle) * TRIANGLE_SPEED;
          const idealVy = Math.sin(t.angle) * TRIANGLE_SPEED;
          const grip = Math.min(1, TRIANGLE_GRIP * dt);
          t.vx += (idealVx - t.vx) * grip;
          t.vy += (idealVy - t.vy) * grip;
          t.x += t.vx * dt; t.y += t.vy * dt;
          const velocityAngle = Math.atan2(t.vy, t.vx);
          let driftDiff = velocityAngle - t.angle;
          while (driftDiff > Math.PI) driftDiff -= Math.PI * 2;
          while (driftDiff < -Math.PI) driftDiff += Math.PI * 2;
          const driftAmount = Math.abs(driftDiff);
          const currentSpeed = Math.sqrt(t.vx * t.vx + t.vy * t.vy);
          if (driftAmount > DRIFT_THRESHOLD && currentSpeed > 60) {
            const skidDx = t.x - t.lastSkidX, skidDy = t.y - t.lastSkidY;
            const skidDist = Math.sqrt(skidDx * skidDx + skidDy * skidDy);
            if (skidDist > 6) {
              const perpX = Math.cos(t.angle + Math.PI / 2) * TRIANGLE_SIZE * 0.7;
              const perpY = Math.sin(t.angle + Math.PI / 2) * TRIANGLE_SIZE * 0.7;
              skidMarks.push({ x: t.x - perpX, y: t.y - perpY, t: 0, life: 0.9, intensity: Math.min(1, (driftAmount - DRIFT_THRESHOLD) * 2) });
              skidMarks.push({ x: t.x + perpX, y: t.y + perpY, t: 0, life: 0.9, intensity: Math.min(1, (driftAmount - DRIFT_THRESHOLD) * 2) });
              t.lastSkidX = t.x; t.lastSkidY = t.y;
            }
          } else { t.lastSkidX = t.x; t.lastSkidY = t.y; }
          const distToPlayer = Math.sqrt((t.x - px) * (t.x - px) + (t.y - py) * (t.y - py));
          if (distToPlayer < TRIANGLE_SIZE * 0.7 + BALL_RADIUS) {
            isDead = true;
            enemies.length = 0; triangles.length = 0; planes.length = 0;
            break;
          }
        }
      }

      // Ракеты
      if (!isDead) {
        for (let i = planes.length - 1; i >= 0; i--) {
          const p = planes[i];
          p.x += p.dx * PLANE_SPEED * dt;
          p.y += p.dy * PLANE_SPEED * dt;
          p.traveled += PLANE_SPEED * dt;
          if (p.traveled > PLANE_MAX_PATH) { planes.splice(i, 1); continue; }
          const ddx = px - p.x, ddy = py - p.y;
          const dist = Math.sqrt(ddx * ddx + ddy * ddy);
          if (dist < PLANE_EXPLOSION_RADIUS) {
            p.inZoneTimer += dt;
            if (p.inZoneTimer >= PLANE_DANGER_DELAY) {
              explosions.push({
                x: p.x, y: p.y, t: 0, duration: 0.7,
                maxRadius: PLANE_EXPLOSION_RADIUS * 1.4,
                lethalRadius: PLANE_EXPLOSION_RADIUS, killsPlayer: true
              });
              planes.splice(i, 1); continue;
            }
          } else { p.inZoneTimer = 0; }
        }
      }
    }

    // Взрывы
    for (let i = explosions.length - 1; i >= 0; i--) {
      const ex = explosions[i];
      ex.t += dt;
      if (ex.killsPlayer && !isDead && !infoOpen) {
        const ddx = px - ex.x, ddy = py - ex.y;
        const dist = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dist < ex.lethalRadius) {
          isDead = true;
          enemies.length = 0; triangles.length = 0; planes.length = 0;
        }
      }
      if (ex.t >= ex.duration) explosions.splice(i, 1);
    }
    // Следы
    for (let i = skidMarks.length - 1; i >= 0; i--) {
      const s = skidMarks[i];
      s.t += dt;
      if (s.t >= s.life) skidMarks.splice(i, 1);
    }

    // Сохранение счёта и монет
    if (isDead && !scoreSavedThisLife) {
      if (nickname && score > 0) saveScoreToSupabase(nickname, score, difficulty);
      const earned = Math.floor(score / 100);
      if (earned > 0) {
        coins += earned;
        coinsEarnedThisLife = earned;
        saveCoins();
      }
      scoreSavedThisLife = true;
    }

    // Рисование игрового мира
    ctx.fillStyle = "rgb(10, 15, 40)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    if (controlMode === "mouse" && !isDead) {
      ctx.beginPath(); ctx.arc(mouseX, mouseY, 6, 0, Math.PI * 2);
      ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(120, 200, 255, 0.7)"; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mouseX - 10, mouseY); ctx.lineTo(mouseX - 3, mouseY);
      ctx.moveTo(mouseX + 3, mouseY); ctx.lineTo(mouseX + 10, mouseY);
      ctx.moveTo(mouseX, mouseY - 10); ctx.lineTo(mouseX, mouseY - 3);
      ctx.moveTo(mouseX, mouseY + 3); ctx.lineTo(mouseX, mouseY + 10);
      ctx.strokeStyle = "rgba(120, 200, 255, 0.5)"; ctx.stroke();
    }
    for (const s of skidMarks) {
      const p = s.t / s.life;
      const alpha = (1 - p) * 0.55 * s.intensity;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.5 + p * 2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 130, 50, " + alpha + ")"; ctx.fill();
    }
    // Жёлтые шары
    for (const e of enemies) {
      if (e.state === "warning") {
        const tt = e.warningTimer / WARNING_TIME;
        const pulse = 0.5 + 0.5 * Math.sin(e.warningTimer * 30);
        const ringRadius = ENEMY_RADIUS + (1 - tt) * 14;
        ctx.beginPath(); ctx.arc(e.x, e.y, ringRadius, 0, Math.PI * 2);
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(250, 220, 60, " + (0.4 + 0.4 * pulse) + ")"; ctx.stroke();
        ctx.beginPath(); ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(250, 220, 60, " + (0.35 + 0.3 * pulse) + ")"; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = "rgb(250, 220, 60)"; ctx.fill();
      }
    }
    // Треугольники
    for (const t of triangles) {
      if (t.state === "warning") {
        const tt = t.warningTimer / TRIANGLE_WARNING_TIME;
        const pulse = 0.5 + 0.5 * Math.sin(t.warningTimer * 30);
        const ringRadius = TRIANGLE_SIZE + (1 - tt) * 14;
        ctx.beginPath(); ctx.arc(t.x, t.y, ringRadius, 0, Math.PI * 2);
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255, 140, 40, " + (0.4 + 0.4 * pulse) + ")"; ctx.stroke();
        ctx.globalAlpha = 0.35 + 0.3 * pulse;
        drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);
        ctx.globalAlpha = 1;
        continue;
      }
      drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);
      const lifeLeft = 1 - t.age / TRIANGLE_LIFETIME;
      const blinkRate = 6 + (1 - lifeLeft) * 20;
      const blinkAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t.age * blinkRate));
      ctx.beginPath(); ctx.arc(t.x, t.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 200, " + blinkAlpha + ")"; ctx.fill();
    }
    // Ракеты
    for (const p of planes) {
      drawPlane(p.x, p.y, p.angle, "rgb(240, 240, 250)");
      if (p.inZoneTimer > 0) {
        const prog = p.inZoneTimer / PLANE_DANGER_DELAY;
        const ringRadius = PLANE_SIZE + (PLANE_EXPLOSION_RADIUS - PLANE_SIZE) * (1 - prog);
        ctx.beginPath(); ctx.arc(p.x, p.y, ringRadius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 60, 30, 0.08)"; ctx.fill();
        const pulse = 0.65 + 0.35 * Math.sin(now / 60);
        ctx.beginPath(); ctx.arc(p.x, p.y, ringRadius, 0, Math.PI * 2);
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255, 100, 50, " + pulse + ")"; ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x, p.y, PLANE_SIZE * 0.9, 0, Math.PI * 2);
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255, 80, 40, " + pulse + ")"; ctx.stroke();
      } else {
        const pulse = 0.4 + 0.3 * Math.sin(now / 100 + p.x);
        ctx.beginPath(); ctx.arc(p.x, p.y, PLANE_SIZE * 0.9, 0, Math.PI * 2);
        ctx.lineWidth = 1; ctx.strokeStyle = "rgba(220, 220, 255, " + pulse + ")"; ctx.stroke();
      }
    }
    // Взрывы
    for (const ex of explosions) {
      const prog = ex.t / ex.duration;
      const radius = 8 + prog * (ex.maxRadius - 8);
      const alpha = 1 - prog;
      if (ex.killsPlayer) {
        ctx.beginPath(); ctx.arc(ex.x, ex.y, radius, 0, Math.PI * 2);
        ctx.lineWidth = 3 * (1 - prog) + 1.5;
        ctx.strokeStyle = "rgba(255, 200, 100, " + alpha + ")"; ctx.stroke();
        const lethalAlpha = Math.max(0, 1 - prog * 1.6);
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 80, 40, " + (lethalAlpha * 0.45) + ")"; ctx.fill();
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI * 2);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "rgba(255, 120, 60, " + (lethalAlpha * 0.9) + ")"; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(ex.x, ex.y, radius, 0, Math.PI * 2);
        ctx.lineWidth = 3 * (1 - prog) + 1;
        ctx.strokeStyle = "rgba(255, 170, 60, " + alpha + ")"; ctx.stroke();
        ctx.beginPath(); ctx.arc(ex.x, ex.y, radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 220, 120, " + (alpha * 0.6) + ")"; ctx.fill();
      }
    }
    // Игрок — со скином
    if (!isDead) {
      const sc = getSkinColors();
      const grad = ctx.createRadialGradient(
        px - BALL_RADIUS * 0.3, py - BALL_RADIUS * 0.3, BALL_RADIUS * 0.15,
        px, py, BALL_RADIUS
      );
      grad.addColorStop(0, sc.light);
      grad.addColorStop(0.5, sc.base);
      grad.addColorStop(1, sc.dark);
      ctx.beginPath(); ctx.arc(px, py, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = grad; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = sc.outline; ctx.stroke();
    }
    if (controlMode === "touch" && !isDead) drawJoystick();

    // HUD
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = "rgb(230, 245, 255)"; ctx.font = "bold 28px sans-serif";
    ctx.fillText("Счёт: " + score, 16, 16);
    ctx.fillStyle = "rgb(160, 200, 240)"; ctx.font = "18px sans-serif";
    ctx.fillText("Лучший счёт: " + bestScore, 16, 52);
    ctx.fillStyle = DIFF_COLORS[difficulty]; ctx.font = "bold 16px sans-serif";
    ctx.fillText("Сложность: " + DIFF_NAMES[difficulty], 16, 78);

    drawCoinIcon(26, 108, 11);
    ctx.fillStyle = "rgb(255, 220, 100)"; ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(String(coins), 44, 109);
    ctx.textAlign = "left"; ctx.textBaseline = "top";

    if (nickname) {
      ctx.fillStyle = "rgba(160, 200, 240, 0.8)"; ctx.font = "15px sans-serif";
      ctx.fillText("Игрок: " + nickname, 16, 128);
    }
    ctx.fillStyle = "rgb(120, 150, 190)"; ctx.font = "14px sans-serif";
    ctx.fillText("Спавн шаров: " + SPAWN_INTERVAL.toFixed(2) + " с", 16, 152);
    ctx.fillText("Треугольников: " + triangles.length, 16, 172);
    ctx.fillText("Ракет: " + planes.length, 16, 190);
    ctx.fillStyle = "rgba(180, 210, 240, 0.85)"; ctx.font = "bold 14px sans-serif";
    if (mobileDevice) ctx.fillText("Кнопка «Сброс» — очищает поле", 16, 214);
    else ctx.fillText("R — сброс · Esc — меню", 16, 214);

    drawCtrlButton(now);
    drawMenuButtonGame(now);
    drawInfoButton(now);

    // Game Over
    if (isDead && !infoOpen) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgb(255, 80, 80)"; ctx.font = "bold 64px sans-serif";
      ctx.fillText("GAME OVER", WIDTH / 2, HEIGHT / 2 - 130);
      ctx.fillStyle = "rgb(230, 245, 255)"; ctx.font = "32px sans-serif";
      ctx.fillText("Твой счёт: " + score, WIDTH / 2, HEIGHT / 2 - 50);
      ctx.fillStyle = "rgb(180, 220, 255)"; ctx.font = "26px sans-serif";
      ctx.fillText("Лучший счёт (" + DIFF_NAMES[difficulty] + "): " + bestScore, WIDTH / 2, HEIGHT / 2 - 5);
      if (coinsEarnedThisLife > 0) {
        drawCoinIcon(WIDTH / 2 - 50, HEIGHT / 2 + 55, 16);
        ctx.fillStyle = "rgb(255, 240, 170)"; ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("+" + coinsEarnedThisLife, WIDTH / 2 - 24, HEIGHT / 2 + 56);
        ctx.textAlign = "center";
      }
      if (score >= bestScore && score > 0) {
        ctx.fillStyle = "rgb(255, 220, 80)"; ctx.font = "bold 22px sans-serif";
        ctx.fillText("★ НОВЫЙ РЕКОРД ★", WIDTH / 2, HEIGHT / 2 + 105);
      }
      ctx.fillStyle = "rgb(200, 200, 220)"; ctx.font = "22px sans-serif";
      if (mobileDevice) ctx.fillText("Нажми «Сброс» чтобы продолжить", WIDTH / 2, HEIGHT / 2 + 155);
      else ctx.fillText("R — заново · Esc — меню", WIDTH / 2, HEIGHT / 2 + 155);
    }
    if (infoOpen) drawInfoOverlay();
  } else {
    ctx.fillStyle = "rgb(10, 15, 40)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    drawMenuScreen(now);
  }

  requestAnimationFrame(loop);
}

updateRestartBtnVisibility();
if (!nickname) showNickInput();
requestAnimationFrame(loop);
</script>
</body>
</html>
