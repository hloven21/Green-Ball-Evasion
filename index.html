<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Зелёный шар</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #05050a;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }
        canvas {
            display: block;
            border: 2px solid #1a2a4a;
            box-shadow: 0 0 40px rgba(30, 80, 180, 0.4);
            max-width: 98vw;
            max-height: 98vh;
            max-height: 98dvh;
            width: auto;
            height: auto;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :fullscreen canvas,
        :-webkit-full-screen canvas {
            border: none;
            box-shadow: none;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
        }

        #restartBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 18px;
            background: #2a4a7a;
            color: #e0f0ff;
            border: 2px solid #4a80c0;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #restartBtn:hover {
            background: #3a6aaa;
        }

        @media (max-width: 900px) and (orientation: portrait) {
            #restartBtn {
                top: auto;
                bottom: 16px;
                right: 16px;
                font-size: 14px;
                padding: 10px 16px;
                opacity: 0.9;
                background: rgba(40, 90, 160, 0.85);
            }
        }
    </style>
</head>
<body>
    <button id="restartBtn">↻ Полная перезагрузка</button>
    <canvas id="game"></canvas>

    <script>
        // ---------- ОПРЕДЕЛЕНИЕ УСТРОЙСТВА ----------
        const uaIsMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i.test(navigator.userAgent);
        const hasTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
        const isSmallScreen = window.innerWidth < 900;
        const mobileDevice = uaIsMobile || (hasTouch && isSmallScreen);

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // ---------- РАЗМЕР ПОЛЯ ----------
        let WIDTH, HEIGHT;

        if (mobileDevice) {
            WIDTH = 800;
            HEIGHT = 1200;
        } else {
            WIDTH = 1200;
            HEIGHT = 800;
        }

        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        canvas.style.aspectRatio = WIDTH + " / " + HEIGHT;

        // ---------- СЛОЖНОСТИ ----------
        const DIFFICULTIES = ["easy", "medium", "hard"];
        const DIFF_NAMES = { easy: "Лёгкая", medium: "Средняя", hard: "Сложная" };
        const DIFF_COLORS = {
            easy: "rgb(140, 230, 150)",
            medium: "rgb(250, 220, 100)",
            hard: "rgb(255, 130, 110)",
        };
        // 1.5x медленнее = 1/1.5 ≈ 0.6667
        const DIFF_MULT = { easy: 2 / 3, medium: 1, hard: 1.5 };

        let difficulty = localStorage.getItem("difficulty") || "medium";
        if (!DIFFICULTIES.includes(difficulty)) difficulty = "medium";

        function bestScoreKey(d) { return "bestScore_" + d; }

        let bestScore = Number(localStorage.getItem(bestScoreKey(difficulty)) || 0);

        // ---------- КОНСТАНТЫ ----------
        const SPEED = 320;
        const BALL_RADIUS = 18;

        const ENEMY_RADIUS = BALL_RADIUS / 2;
        const WARNING_TIME = 1.0;

        const SPAWN_INTERVAL_INIT = 1.2;
        let SPAWN_INTERVAL = SPAWN_INTERVAL_INIT;
        const SPAWN_MIN = 0.3;
        const SPEEDUP_EVERY = 5;
        const SPEEDUP_FACTOR = 0.85;

        const TRIANGLE_SIZE = 14;
        const TRIANGLE_LIFETIME = 6.0;
        const TRIANGLE_SPAWN_INTERVAL = 2.5;
        const TRIANGLE_WARNING_TIME = 1.0;

        const TRIANGLE_TURN_RATE = 3.0;
        const TRIANGLE_GRIP = 2.2;
        const DRIFT_THRESHOLD = 0.35;

        const TRIANGLE_COLOR = "rgb(255, 120, 0)";

        const PLANE_SIZE = 16;
        const PLANE_SPAWN_INTERVAL = 1.75;
        const PLANE_EXPLOSION_RADIUS = BALL_RADIUS * 6;
        const PLANE_DANGER_DELAY = 0.5;

        const PLANE_MAX_PATH = 1600;

        // ---------- СКОРОСТИ (пересчитываются при смене сложности) ----------
        let ENEMY_SPEED = 320;
        let TRIANGLE_SPEED = 210;
        let PLANE_SPEED = 210;

        function applyDifficulty() {
            const m = DIFF_MULT[difficulty];
            ENEMY_SPEED = 320 * m;
            TRIANGLE_SPEED = 210 * m;
            PLANE_SPEED = 210 * m;
        }
        applyDifficulty();

        // ---------- УПРАВЛЕНИЕ ----------
        const CONTROL_MODES = ["keyboard", "mouse", "touch"];
        let controlModeIndex = mobileDevice ? 2 : 0;
        let controlMode = CONTROL_MODES[controlModeIndex];

        let mouseX = WIDTH / 2;
        let mouseY = HEIGHT / 2;
        const MOUSE_DEADZONE = 4;

        // -------- ДЖОЙСТИК --------
        const JOYSTICK_BASE_RADIUS = 120;
        const JOYSTICK_KNOB_RADIUS = 55;
        const JOYSTICK_MAX_DIST = JOYSTICK_BASE_RADIUS - 12;
        const JOYSTICK_MARGIN = 60;
        const JOYSTICK_GRAB_RADIUS = JOYSTICK_BASE_RADIUS * 1.4;
        const JOYSTICK_DEADZONE = 0.15;
        const JOYSTICK_ANALOG = false;

        const JOYSTICK_CX = JOYSTICK_MARGIN + JOYSTICK_BASE_RADIUS;
        const JOYSTICK_CY = HEIGHT - JOYSTICK_MARGIN - JOYSTICK_BASE_RADIUS;

        let joystickTouchId = null;
        let joystickMouseDown = false;
        let joystickKnobX = JOYSTICK_CX;
        let joystickKnobY = JOYSTICK_CY;
        let joystickDirX = 0;
        let joystickDirY = 0;
        let joystickMagnitude = 0;

        // -------- КНОПКА СМЕНЫ РЕЖИМА --------
        const CTRL_BTN_W = 280;
        const CTRL_BTN_H = 68;
        const CTRL_BTN_X = WIDTH - 16 - CTRL_BTN_W;
        const CTRL_BTN_Y = 16;
        let ctrlBtnPressed = false;

        // -------- КНОПКА ШЕСТЕРЁНКИ --------
        const INFO_BTN_SIZE = 50;
        const INFO_BTN_X = WIDTH - 16 - INFO_BTN_SIZE;
        const INFO_BTN_Y = CTRL_BTN_Y + CTRL_BTN_H + 10;
        let infoBtnPressed = false;
        let infoOpen = false;
        let infoCloseBtnPressed = false;

        // -------- ПАНЕЛЬ ИНФОРМАЦИИ --------
        const INFO_PANEL_W = Math.min(WIDTH - 40, 700);
        const INFO_PANEL_H = Math.min(HEIGHT - 80, 760);
        const INFO_PANEL_X = (WIDTH - INFO_PANEL_W) / 2;
        const INFO_PANEL_Y = (HEIGHT - INFO_PANEL_H) / 2;

        const INFO_CLOSE_W = 200;
        const INFO_CLOSE_H = 54;
        const INFO_CLOSE_X = WIDTH / 2 - INFO_CLOSE_W / 2;
        const INFO_CLOSE_Y = INFO_PANEL_Y + INFO_PANEL_H - INFO_CLOSE_H - 24;

        // -------- РАЗМЕТКА СЕКЦИИ СЛОЖНОСТИ --------
        const DIFF_PAD = 36;
        const DIFF_AVAIL_W = INFO_PANEL_W - DIFF_PAD * 2;
        const DIFF_BTN_GAP = 20;
        const DIFF_BTN_W = (DIFF_AVAIL_W - DIFF_BTN_GAP * 2) / 3;
        const DIFF_BTN_H = 54;

        const DIFF_SECTION_Y = INFO_PANEL_Y + 370;         // заголовок «СЛОЖНОСТЬ»
        const DIFF_BTN_Y = DIFF_SECTION_Y + 32;            // кнопки
        const DIFF_BTN_X1 = INFO_PANEL_X + DIFF_PAD;
        const DIFF_BTN_X2 = DIFF_BTN_X1 + DIFF_BTN_W + DIFF_BTN_GAP;
        const DIFF_BTN_X3 = DIFF_BTN_X2 + DIFF_BTN_W + DIFF_BTN_GAP;

        function isOnInfoBtn(x, y) {
            return x >= INFO_BTN_X && x <= INFO_BTN_X + INFO_BTN_SIZE &&
                   y >= INFO_BTN_Y && y <= INFO_BTN_Y + INFO_BTN_SIZE;
        }

        function isOnInfoClose(x, y) {
            return x >= INFO_CLOSE_X && x <= INFO_CLOSE_X + INFO_CLOSE_W &&
                   y >= INFO_CLOSE_Y && y <= INFO_CLOSE_Y + INFO_CLOSE_H;
        }

        function isOnInfoPanel(x, y) {
            return x >= INFO_PANEL_X && x <= INFO_PANEL_X + INFO_PANEL_W &&
                   y >= INFO_PANEL_Y && y <= INFO_PANEL_Y + INFO_PANEL_H;
        }

        function isOnCtrlButton(x, y) {
            return x >= CTRL_BTN_X && x <= CTRL_BTN_X + CTRL_BTN_W &&
                   y >= CTRL_BTN_Y && y <= CTRL_BTN_Y + CTRL_BTN_H;
        }

        // Возвращает "easy" | "medium" | "hard" | null
        function getDiffButtonAt(x, y) {
            if (y < DIFF_BTN_Y || y > DIFF_BTN_Y + DIFF_BTN_H) return null;
            if (x >= DIFF_BTN_X1 && x <= DIFF_BTN_X1 + DIFF_BTN_W) return "easy";
            if (x >= DIFF_BTN_X2 && x <= DIFF_BTN_X2 + DIFF_BTN_W) return "medium";
            if (x >= DIFF_BTN_X3 && x <= DIFF_BTN_X3 + DIFF_BTN_W) return "hard";
            return null;
        }

        function cycleControlMode() {
            controlModeIndex = (controlModeIndex + 1) % CONTROL_MODES.length;
            controlMode = CONTROL_MODES[controlModeIndex];

            if (controlMode !== "touch") {
                joystickTouchId = null;
                joystickMouseDown = false;
                resetJoystick();
            }
        }

        function getModeText() {
            if (controlMode === "keyboard") return "WASD";
            if (controlMode === "mouse") return "МЫШЬ";
            return "ДЖОЙСТИК";
        }

        function getModeColor() {
            if (controlMode === "keyboard") return "rgb(160, 220, 180)";
            if (controlMode === "mouse") return "rgb(160, 200, 255)";
            return "rgb(255, 200, 130)";
        }

        function isInJoystickZone(x, y) {
            const dx = x - JOYSTICK_CX;
            const dy = y - JOYSTICK_CY;
            return (dx * dx + dy * dy) <= JOYSTICK_GRAB_RADIUS * JOYSTICK_GRAB_RADIUS;
        }

        function setJoystickFromPoint(x, y) {
            const rawDx = x - JOYSTICK_CX;
            const rawDy = y - JOYSTICK_CY;
            const rawDist = Math.sqrt(rawDx * rawDx + rawDy * rawDy);

            if (rawDist < 0.001) {
                resetJoystick();
                return;
            }

            const dirX = rawDx / rawDist;
            const dirY = rawDy / rawDist;
            const clampedDist = Math.min(rawDist, JOYSTICK_MAX_DIST);

            joystickKnobX = JOYSTICK_CX + dirX * clampedDist;
            joystickKnobY = JOYSTICK_CY + dirY * clampedDist;
            joystickDirX = dirX;
            joystickDirY = dirY;
            joystickMagnitude = Math.min(1, rawDist / JOYSTICK_MAX_DIST);
        }

        function resetJoystick() {
            joystickKnobX = JOYSTICK_CX;
            joystickKnobY = JOYSTICK_CY;
            joystickDirX = 0;
            joystickDirY = 0;
            joystickMagnitude = 0;
        }

        // -------- ПОЛНОЭКРАННЫЙ РЕЖИМ --------
        let fullscreenRequested = false;

        function enterFullscreenOnMobile() {
            if (!mobileDevice || fullscreenRequested) return;
            fullscreenRequested = true;

            const el = document.documentElement;
            const req = el.requestFullscreen
                     || el.webkitRequestFullscreen
                     || el.mozRequestFullScreen
                     || el.msRequestFullscreen;

            if (req) {
                try {
                    const p = req.call(el);
                    if (p && p.catch) p.catch(() => {});
                } catch (e) {}
            }

            if (screen.orientation && screen.orientation.lock) {
                try {
                    const p = screen.orientation.lock("portrait");
                    if (p && p.catch) p.catch(() => {});
                } catch (e) {}
            }
        }

        let px = WIDTH / 2;
        let py = HEIGHT / 2;

        const keys = {};
        const enemies = [];
        const triangles = [];
        const planes = [];
        const explosions = [];
        const skidMarks = [];

        let spawnTimer = 0;
        let speedupTimer = 0;
        let triangleSpawnTimer = 0;
        let planeSpawnTimer = 0;
        let isDead = false;

        // -------- СЧЁТ --------
        let score = 0;
        let scoreTimer = 0;
        const SCORE_PER_SECOND = 10;

        // -------- МЯГКИЙ СБРОС --------
        function softReset() {
            enemies.length = 0;
            triangles.length = 0;
            planes.length = 0;
            explosions.length = 0;
            skidMarks.length = 0;

            px = WIDTH / 2;
            py = HEIGHT / 2;

            spawnTimer = 0;
            speedupTimer = 0;
            triangleSpawnTimer = 0;
            planeSpawnTimer = 0;

            SPAWN_INTERVAL = SPAWN_INTERVAL_INIT;

            scoreTimer = 0;
            isDead = false;

            joystickTouchId = null;
            joystickMouseDown = false;
            resetJoystick();
        }

        function restartGame() {
            location.reload();
        }

        // -------- СМЕНА СЛОЖНОСТИ --------
        function setDifficulty(newDiff) {
            if (newDiff === difficulty) return;
            difficulty = newDiff;
            localStorage.setItem("difficulty", difficulty);
            applyDifficulty();
            bestScore = Number(localStorage.getItem(bestScoreKey(difficulty)) || 0);
            // Полный мягкий сброс с обнулением счёта — начинаем «с чистого листа»
            score = 0;
            softReset();
        }

        // -------- КЛАВИАТУРА --------
        window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;

            if (k === "escape" && infoOpen) {
                infoOpen = false;
                return;
            }

            if (infoOpen) return;

            if (k === "r" || k === "к") {
                softReset();
            }
            if (k === "q" || k === "й") {
                cycleControlMode();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // -------- КООРДИНАТЫ --------
        function canvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = WIDTH / rect.width;
            const scaleY = HEIGHT / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
            };
        }

        function updateMouse(e) {
            const p = canvasCoords(e.clientX, e.clientY);
            mouseX = Math.max(0, Math.min(WIDTH, p.x));
            mouseY = Math.max(0, Math.min(HEIGHT, p.y));
        }

        canvas.addEventListener("mousemove", updateMouse);

        // -------- МЫШЬ --------
        canvas.addEventListener("mousedown", (e) => {
            updateMouse(e);
            const p = canvasCoords(e.clientX, e.clientY);

            if (infoOpen) {
                if (isOnInfoClose(p.x, p.y)) {
                    infoCloseBtnPressed = true;
                    return;
                }
                const diff = getDiffButtonAt(p.x, p.y);
                if (diff) {
                    setDifficulty(diff);
                    return;
                }
                if (!isOnInfoPanel(p.x, p.y)) {
                    infoOpen = false;
                }
                return;
            }

            if (isOnCtrlButton(p.x, p.y)) {
                ctrlBtnPressed = true;
                return;
            }

            if (isOnInfoBtn(p.x, p.y)) {
                infoBtnPressed = true;
                return;
            }

            if (controlMode === "touch" && isInJoystickZone(p.x, p.y)) {
                joystickMouseDown = true;
                setJoystickFromPoint(p.x, p.y);
            }
        });

        canvas.addEventListener("mousemove", (e) => {
            if (infoOpen) return;
            if (!joystickMouseDown) return;
            const p = canvasCoords(e.clientX, e.clientY);
            setJoystickFromPoint(p.x, p.y);
        });

        window.addEventListener("mouseup", () => {
            if (infoCloseBtnPressed) {
                infoCloseBtnPressed = false;
                infoOpen = false;
                return;
            }
            if (infoBtnPressed) {
                infoBtnPressed = false;
                infoOpen = true;
                return;
            }
            if (ctrlBtnPressed) {
                ctrlBtnPressed = false;
                cycleControlMode();
                return;
            }
            if (joystickMouseDown) {
                joystickMouseDown = false;
                resetJoystick();
            }
        });

        // -------- КАСАНИЯ --------
        function touchToCanvas(touch) {
            return canvasCoords(touch.clientX, touch.clientY);
        }

        canvas.addEventListener("touchstart", (e) => {
            enterFullscreenOnMobile();
            e.preventDefault();

            for (const t of e.changedTouches) {
                const pos = touchToCanvas(t);

                if (infoOpen) {
                    if (isOnInfoClose(pos.x, pos.y)) {
                        infoOpen = false;
                        continue;
                    }
                    const diff = getDiffButtonAt(pos.x, pos.y);
                    if (diff) {
                        setDifficulty(diff);
                        continue;
                    }
                    if (!isOnInfoPanel(pos.x, pos.y)) {
                        infoOpen = false;
                    }
                    continue;
                }

                if (isOnInfoBtn(pos.x, pos.y)) {
                    infoOpen = true;
                    continue;
                }

                if (isOnCtrlButton(pos.x, pos.y)) {
                    cycleControlMode();
                    continue;
                }

                if (controlMode === "touch" && joystickTouchId === null && isInJoystickZone(pos.x, pos.y)) {
                    joystickTouchId = t.identifier;
                    setJoystickFromPoint(pos.x, pos.y);
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (infoOpen) return;
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    const pos = touchToCanvas(t);
                    setJoystickFromPoint(pos.x, pos.y);
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    resetJoystick();
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchcancel", (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    resetJoystick();
                }
            }
        });

        // -------- HTML-КНОПКА В УГЛУ --------
        const restartBtn = document.getElementById("restartBtn");

        if (mobileDevice) {
            restartBtn.textContent = "↻ Сброс";
            restartBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (infoOpen) { infoOpen = false; return; }
                softReset();
            });
            restartBtn.addEventListener("touchstart", (e) => {
                e.stopPropagation();
            }, { passive: true });
        } else {
            restartBtn.textContent = "↻ Полная перезагрузка";
            restartBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (infoOpen) { infoOpen = false; return; }
                restartGame();
            });
        }

        // -------- РИСОВАНИЕ --------
        function drawTriangle(x, y, angle, fillStyle) {
            const r = TRIANGLE_SIZE;
            const h = r * Math.sqrt(3) / 2;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(-r / 2, -h);
            ctx.lineTo(-r / 2, h);
            ctx.closePath();

            ctx.fillStyle = fillStyle;
            ctx.fill();

            ctx.restore();
        }

        function drawPlane(x, y, angle, fillStyle) {
            const s = PLANE_SIZE;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(s, 0);
            ctx.lineTo(-s * 0.3, -s * 0.25);
            ctx.lineTo(-s * 0.3, -s * 0.9);
            ctx.lineTo(-s * 0.7, -s * 0.9);
            ctx.lineTo(-s * 0.7, -s * 0.25);
            ctx.lineTo(-s, -s * 0.25);
            ctx.lineTo(-s, s * 0.25);
            ctx.lineTo(-s * 0.7, s * 0.25);
            ctx.lineTo(-s * 0.7, s * 0.9);
            ctx.lineTo(-s * 0.3, s * 0.9);
            ctx.lineTo(-s * 0.3, s * 0.25);
            ctx.closePath();

            ctx.fillStyle = fillStyle;
            ctx.fill();

            ctx.restore();
        }

        function drawIconCircle(x, y, r, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawIconTriangle(x, y, size, color) {
            const h = size * Math.sqrt(3) / 2;
            ctx.beginPath();
            ctx.moveTo(x + size, y);
            ctx.lineTo(x - size / 2, y - h);
            ctx.lineTo(x - size / 2, y + h);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawIconPlane(x, y, size, color) {
            const s = size;
            ctx.beginPath();
            ctx.moveTo(x + s, y);
            ctx.lineTo(x - s * 0.3, y - s * 0.25);
            ctx.lineTo(x - s * 0.3, y - s * 0.9);
            ctx.lineTo(x - s * 0.7, y - s * 0.9);
            ctx.lineTo(x - s * 0.7, y - s * 0.25);
            ctx.lineTo(x - s, y - s * 0.25);
            ctx.lineTo(x - s, y + s * 0.25);
            ctx.lineTo(x - s * 0.7, y + s * 0.25);
            ctx.lineTo(x - s * 0.7, y + s * 0.9);
            ctx.lineTo(x - s * 0.3, y + s * 0.9);
            ctx.lineTo(x - s * 0.3, y + s * 0.25);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawGear(cx, cy, outerR, innerR, teeth, holeR, fillStyle) {
            const steps = teeth * 4;
            const startOffset = -Math.PI / 2;

            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const angle = startOffset + (i / steps) * Math.PI * 2;
                const phase = i % 4;
                const r = (phase === 0 || phase === 1) ? outerR : innerR;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            ctx.moveTo(cx + holeR, cy);
            ctx.arc(cx, cy, holeR, 0, Math.PI * 2, true);

            ctx.fillStyle = fillStyle;
            ctx.fill();
        }

        function drawJoystick() {
            const active = joystickTouchId !== null || joystickMouseDown;

            ctx.beginPath();
            ctx.arc(JOYSTICK_CX, JOYSTICK_CY, JOYSTICK_BASE_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(60, 100, 160, 0.25)";
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(120, 170, 230, 0.55)";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(JOYSTICK_CX, JOYSTICK_CY, JOYSTICK_BASE_RADIUS * 0.5, 0, Math.PI * 2);
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(120, 170, 230, 0.25)";
            ctx.stroke();

            if (joystickMagnitude > 0.05) {
                ctx.beginPath();
                ctx.moveTo(JOYSTICK_CX, JOYSTICK_CY);
                ctx.lineTo(joystickKnobX, joystickKnobY);
                ctx.lineWidth = 4;
                ctx.strokeStyle = active
                    ? "rgba(180, 220, 255, 0.7)"
                    : "rgba(150, 200, 255, 0.35)";
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(joystickKnobX, joystickKnobY, JOYSTICK_KNOB_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = active
                ? "rgba(120, 200, 255, 0.65)"
                : "rgba(90, 150, 220, 0.45)";
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = active
                ? "rgba(220, 240, 255, 0.95)"
                : "rgba(140, 190, 240, 0.7)";
            ctx.stroke();

            if (joystickMagnitude > 0.1) {
                const dotX = joystickKnobX + joystickDirX * 18;
                const dotY = joystickKnobY + joystickDirY * 18;
                ctx.beginPath();
                ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.fill();
            }
        }

        // -------- СПАВН --------
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let ex, ey;

            if (side === 0) {
                ex = Math.random() * (WIDTH - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
                ey = ENEMY_RADIUS;
            } else if (side === 1) {
                ex = WIDTH - ENEMY_RADIUS;
                ey = Math.random() * (HEIGHT - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
            } else if (side === 2) {
                ex = Math.random() * (WIDTH - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
                ey = HEIGHT - ENEMY_RADIUS;
            } else {
                ex = ENEMY_RADIUS;
                ey = Math.random() * (HEIGHT - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
            }

            enemies.push({
                x: ex, y: ey,
                dx: 0, dy: 0,
                state: "warning",
                warningTimer: 0,
            });
        }

        function spawnTriangle() {
            const side = Math.floor(Math.random() * 4);
            let tx, ty;

            if (side === 0) {
                tx = Math.random() * (WIDTH - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
                ty = TRIANGLE_SIZE;
            } else if (side === 1) {
                tx = WIDTH - TRIANGLE_SIZE;
                ty = Math.random() * (HEIGHT - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
            } else if (side === 2) {
                tx = Math.random() * (WIDTH - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
                ty = HEIGHT - TRIANGLE_SIZE;
            } else {
                tx = TRIANGLE_SIZE;
                ty = Math.random() * (HEIGHT - 2 * TRIANGLE_SIZE) + TRIANGLE_SIZE;
            }

            triangles.push({
                x: tx, y: ty,
                vx: 0, vy: 0,
                angle: 0,
                age: 0,
                state: "warning",
                warningTimer: 0,
                lastSkidX: tx,
                lastSkidY: ty,
            });
        }

        function spawnPlane() {
            const side = Math.floor(Math.random() * 4);
            let x, y;

            if (side === 0) {
                x = Math.random() * (WIDTH - 2 * PLANE_SIZE) + PLANE_SIZE;
                y = PLANE_SIZE;
            } else if (side === 1) {
                x = WIDTH - PLANE_SIZE;
                y = Math.random() * (HEIGHT - 2 * PLANE_SIZE) + PLANE_SIZE;
            } else if (side === 2) {
                x = Math.random() * (WIDTH - 2 * PLANE_SIZE) + PLANE_SIZE;
                y = HEIGHT - PLANE_SIZE;
            } else {
                x = PLANE_SIZE;
                y = Math.random() * (HEIGHT - 2 * PLANE_SIZE) + PLANE_SIZE;
            }

            const targetX = px;
            const targetY = py;

            let dx = targetX - x;
            let dy = targetY - y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            dx /= len;
            dy /= len;

            planes.push({
                x: x, y: y,
                dx: dx, dy: dy,
                angle: Math.atan2(dy, dx),
                traveled: 0,
                inZoneTimer: 0,
            });
        }

        // -------- ИГРОВОЙ ЦИКЛ --------
        let lastTime = performance.now();

        function loop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (!isDead && !infoOpen) {
                let dx = 0;
                let dy = 0;

                if (controlMode === "keyboard") {
                    if (keys["a"] || keys["ф"]) dx -= 1;
                    if (keys["d"] || keys["в"]) dx += 1;
                    if (keys["w"] || keys["ц"]) dy -= 1;
                    if (keys["s"] || keys["ы"]) dy += 1;

                    if (dx !== 0 && dy !== 0) {
                        const len = Math.sqrt(dx * dx + dy * dy);
                        dx /= len;
                        dy /= len;
                    }

                    px += dx * SPEED * dt;
                    py += dy * SPEED * dt;
                } else if (controlMode === "mouse") {
                    const mdx = mouseX - px;
                    const mdy = mouseY - py;
                    const dist = Math.sqrt(mdx * mdx + mdy * mdy);

                    if (dist > MOUSE_DEADZONE) {
                        const step = SPEED * dt;
                        if (step >= dist) {
                            px = mouseX;
                            py = mouseY;
                        } else {
                            px += (mdx / dist) * step;
                            py += (mdy / dist) * step;
                        }
                    }
                } else {
                    if (joystickMagnitude > JOYSTICK_DEADZONE &&
                        (joystickDirX !== 0 || joystickDirY !== 0)) {

                        if (JOYSTICK_ANALOG) {
                            const eff = Math.min(1, (joystickMagnitude - JOYSTICK_DEADZONE) / (1 - JOYSTICK_DEADZONE));
                            px += joystickDirX * SPEED * eff * dt;
                            py += joystickDirY * SPEED * eff * dt;
                        } else {
                            px += joystickDirX * SPEED * dt;
                            py += joystickDirY * SPEED * dt;
                        }
                    }
                }

                if (px < BALL_RADIUS) px = BALL_RADIUS;
                if (px > WIDTH - BALL_RADIUS) px = WIDTH - BALL_RADIUS;
                if (py < BALL_RADIUS) py = BALL_RADIUS;
                if (py > HEIGHT - BALL_RADIUS) py = HEIGHT - BALL_RADIUS;

                scoreTimer += dt;
                if (scoreTimer >= 1) {
                    scoreTimer -= 1;
                    score += SCORE_PER_SECOND;
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem(bestScoreKey(difficulty), bestScore);
                    }
                }

                speedupTimer += dt;
                if (speedupTimer >= SPEEDUP_EVERY) {
                    speedupTimer -= SPEEDUP_EVERY;
                    SPAWN_INTERVAL = Math.max(SPAWN_MIN, SPAWN_INTERVAL * SPEEDUP_FACTOR);
                }

                spawnTimer += dt;
                if (spawnTimer >= SPAWN_INTERVAL) {
                    spawnTimer -= SPAWN_INTERVAL;
                    spawnEnemy();
                }

                triangleSpawnTimer += dt;
                if (triangleSpawnTimer >= TRIANGLE_SPAWN_INTERVAL) {
                    triangleSpawnTimer -= TRIANGLE_SPAWN_INTERVAL;
                    spawnTriangle();
                }

                planeSpawnTimer += dt;
                if (planeSpawnTimer >= PLANE_SPAWN_INTERVAL) {
                    planeSpawnTimer -= PLANE_SPAWN_INTERVAL;
                    spawnPlane();
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];

                    if (e.state === "warning") {
                        e.warningTimer += dt;
                        if (e.warningTimer >= WARNING_TIME) {
                            let ddx = px - e.x;
                            let ddy = py - e.y;
                            const len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
                            e.dx = ddx / len;
                            e.dy = ddy / len;
                            e.state = "attack";
                        }
                    } else {
                        e.x += e.dx * ENEMY_SPEED * dt;
                        e.y += e.dy * ENEMY_SPEED * dt;

                        if (
                            e.x < -ENEMY_RADIUS ||
                            e.x > WIDTH + ENEMY_RADIUS ||
                            e.y < -ENEMY_RADIUS ||
                            e.y > HEIGHT + ENEMY_RADIUS
                        ) {
                            enemies.splice(i, 1);
                            continue;
                        }

                        const ddx = e.x - px;
                        const ddy = e.y - py;
                        const dist = Math.sqrt(ddx * ddx + ddy * ddy);
                        if (dist < ENEMY_RADIUS + BALL_RADIUS) {
                            isDead = true;
                            enemies.length = 0;
                            triangles.length = 0;
                            planes.length = 0;
                            break;
                        }
                    }
                }

                if (!isDead) {
                    for (let i = triangles.length - 1; i >= 0; i--) {
                        const t = triangles[i];

                        if (t.state === "warning") {
                            t.warningTimer += dt;
                            const adx = px - t.x;
                            const ady = py - t.y;
                            const targetAngle = Math.atan2(ady, adx);
                            let diff = targetAngle - t.angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            t.angle += diff * Math.min(1, TRIANGLE_TURN_RATE * dt);

                            if (t.warningTimer >= TRIANGLE_WARNING_TIME) {
                                t.state = "attack";
                                t.age = 0;
                            }
                            continue;
                        }

                        t.age += dt;

                        if (t.age >= TRIANGLE_LIFETIME) {
                            explosions.push({
                                x: t.x, y: t.y, t: 0,
                                duration: 0.45,
                                maxRadius: 42,
                                killsPlayer: false,
                            });
                            triangles.splice(i, 1);
                            continue;
                        }

                        const ddx = px - t.x;
                        const ddy = py - t.y;
                        const targetAngle = Math.atan2(ddy, ddx);

                        let diff = targetAngle - t.angle;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        const maxTurn = TRIANGLE_TURN_RATE * dt;
                        if (Math.abs(diff) > maxTurn) {
                            t.angle += Math.sign(diff) * maxTurn;
                        } else {
                            t.angle = targetAngle;
                        }

                        const idealVx = Math.cos(t.angle) * TRIANGLE_SPEED;
                        const idealVy = Math.sin(t.angle) * TRIANGLE_SPEED;

                        const grip = Math.min(1, TRIANGLE_GRIP * dt);
                        t.vx += (idealVx - t.vx) * grip;
                        t.vy += (idealVy - t.vy) * grip;

                        t.x += t.vx * dt;
                        t.y += t.vy * dt;

                        const velocityAngle = Math.atan2(t.vy, t.vx);
                        let driftDiff = velocityAngle - t.angle;
                        while (driftDiff > Math.PI) driftDiff -= Math.PI * 2;
                        while (driftDiff < -Math.PI) driftDiff += Math.PI * 2;
                        const driftAmount = Math.abs(driftDiff);

                        const currentSpeed = Math.sqrt(t.vx * t.vx + t.vy * t.vy);
                        if (driftAmount > DRIFT_THRESHOLD && currentSpeed > 60) {
                            const skidDx = t.x - t.lastSkidX;
                            const skidDy = t.y - t.lastSkidY;
                            const skidDist = Math.sqrt(skidDx * skidDx + skidDy * skidDy);

                            if (skidDist > 6) {
                                const perpX = Math.cos(t.angle + Math.PI / 2) * TRIANGLE_SIZE * 0.7;
                                const perpY = Math.sin(t.angle + Math.PI / 2) * TRIANGLE_SIZE * 0.7;

                                skidMarks.push({
                                    x: t.x - perpX, y: t.y - perpY,
                                    t: 0, life: 0.9,
                                    intensity: Math.min(1, (driftAmount - DRIFT_THRESHOLD) * 2),
                                });
                                skidMarks.push({
                                    x: t.x + perpX, y: t.y + perpY,
                                    t: 0, life: 0.9,
                                    intensity: Math.min(1, (driftAmount - DRIFT_THRESHOLD) * 2),
                                });

                                t.lastSkidX = t.x;
                                t.lastSkidY = t.y;
                            }
                        } else {
                            t.lastSkidX = t.x;
                            t.lastSkidY = t.y;
                        }

                        const distToPlayer = Math.sqrt(
                            (t.x - px) * (t.x - px) + (t.y - py) * (t.y - py)
                        );
                        if (distToPlayer < TRIANGLE_SIZE * 0.7 + BALL_RADIUS) {
                            isDead = true;
                            enemies.length = 0;
                            triangles.length = 0;
                            planes.length = 0;
                            break;
                        }
                    }
                }

                if (!isDead) {
                    for (let i = planes.length - 1; i >= 0; i--) {
                        const p = planes[i];

                        p.x += p.dx * PLANE_SPEED * dt;
                        p.y += p.dy * PLANE_SPEED * dt;
                        p.traveled += PLANE_SPEED * dt;

                        if (p.traveled > PLANE_MAX_PATH) {
                            planes.splice(i, 1);
                            continue;
                        }

                        const ddx = px - p.x;
                        const ddy = py - p.y;
                        const dist = Math.sqrt(ddx * ddx + ddy * ddy);

                        if (dist < PLANE_EXPLOSION_RADIUS) {
                            p.inZoneTimer += dt;

                            if (p.inZoneTimer >= PLANE_DANGER_DELAY) {
                                explosions.push({
                                    x: p.x, y: p.y, t: 0,
                                    duration: 0.7,
                                    maxRadius: PLANE_EXPLOSION_RADIUS * 1.4,
                                    lethalRadius: PLANE_EXPLOSION_RADIUS,
                                    killsPlayer: true,
                                });
                                planes.splice(i, 1);
                                continue;
                            }
                        } else {
                            p.inZoneTimer = 0;
                        }
                    }
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.t += dt;

                if (ex.killsPlayer && !isDead && !infoOpen) {
                    const ddx = px - ex.x;
                    const ddy = py - ex.y;
                    const dist = Math.sqrt(ddx * ddx + ddy * ddy);
                    if (dist < ex.lethalRadius) {
                        isDead = true;
                        enemies.length = 0;
                        triangles.length = 0;
                        planes.length = 0;
                    }
                }

                if (ex.t >= ex.duration) explosions.splice(i, 1);
            }

            for (let i = skidMarks.length - 1; i >= 0; i--) {
                const s = skidMarks[i];
                s.t += dt;
                if (s.t >= s.life) skidMarks.splice(i, 1);
            }

            // -------- ОТРИСОВКА --------
            ctx.fillStyle = "rgb(10, 15, 40)";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            if (controlMode === "mouse" && !isDead) {
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 6, 0, Math.PI * 2);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "rgba(120, 200, 255, 0.7)";
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(mouseX - 10, mouseY);
                ctx.lineTo(mouseX - 3, mouseY);
                ctx.moveTo(mouseX + 3, mouseY);
                ctx.lineTo(mouseX + 10, mouseY);
                ctx.moveTo(mouseX, mouseY - 10);
                ctx.lineTo(mouseX, mouseY - 3);
                ctx.moveTo(mouseX, mouseY + 3);
                ctx.lineTo(mouseX, mouseY + 10);
                ctx.strokeStyle = "rgba(120, 200, 255, 0.5)";
                ctx.stroke();
            }

            for (const s of skidMarks) {
                const p = s.t / s.life;
                const alpha = (1 - p) * 0.55 * s.intensity;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 2.5 + p * 2, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 130, 50, " + alpha + ")";
                ctx.fill();
            }

            for (const e of enemies) {
                if (e.state === "warning") {
                    const tt = e.warningTimer / WARNING_TIME;
                    const pulse = 0.5 + 0.5 * Math.sin(e.warningTimer * 30);
                    const ringRadius = ENEMY_RADIUS + (1 - tt) * 14;

                    ctx.beginPath();
                    ctx.arc(e.x, e.y, ringRadius, 0, Math.PI * 2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(250, 220, 60, " + (0.4 + 0.4 * pulse) + ")";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(250, 220, 60, " + (0.35 + 0.3 * pulse) + ")";
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = "rgb(250, 220, 60)";
                    ctx.fill();
                }
            }

            for (const t of triangles) {
                if (t.state === "warning") {
                    const tt = t.warningTimer / TRIANGLE_WARNING_TIME;
                    const pulse = 0.5 + 0.5 * Math.sin(t.warningTimer * 30);
                    const ringRadius = TRIANGLE_SIZE + (1 - tt) * 14;

                    ctx.beginPath();
                    ctx.arc(t.x, t.y, ringRadius, 0, Math.PI * 2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(255, 140, 40, " + (0.4 + 0.4 * pulse) + ")";
                    ctx.stroke();

                    ctx.globalAlpha = 0.35 + 0.3 * pulse;
                    drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);
                    ctx.globalAlpha = 1;
                    continue;
                }

                drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);

                const lifeLeft = 1 - t.age / TRIANGLE_LIFETIME;
                const blinkRate = 6 + (1 - lifeLeft) * 20;
                const blinkAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t.age * blinkRate));
                ctx.beginPath();
                ctx.arc(t.x, t.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 200, " + blinkAlpha + ")";
                ctx.fill();
            }

            for (const p of planes) {
                drawPlane(p.x, p.y, p.angle, "rgb(240, 240, 250)");

                if (p.inZoneTimer > 0) {
                    const prog = p.inZoneTimer / PLANE_DANGER_DELAY;
                    const ringRadius = PLANE_SIZE + (PLANE_EXPLOSION_RADIUS - PLANE_SIZE) * (1 - prog);

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, ringRadius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 60, 30, 0.08)";
                    ctx.fill();

                    const pulse = 0.65 + 0.35 * Math.sin(now / 60);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, ringRadius, 0, Math.PI * 2);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "rgba(255, 100, 50, " + pulse + ")";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, PLANE_SIZE * 0.9, 0, Math.PI * 2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(255, 80, 40, " + pulse + ")";
                    ctx.stroke();
                } else {
                    const pulse = 0.4 + 0.3 * Math.sin(now / 100 + p.x);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, PLANE_SIZE * 0.9, 0, Math.PI * 2);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(220, 220, 255, " + pulse + ")";
                    ctx.stroke();
                }
            }

            for (const ex of explosions) {
                const prog = ex.t / ex.duration;
                const radius = 8 + prog * (ex.maxRadius - 8);
                const alpha = 1 - prog;

                if (ex.killsPlayer) {
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, radius, 0, Math.PI * 2);
                    ctx.lineWidth = 3 * (1 - prog) + 1.5;
                    ctx.strokeStyle = "rgba(255, 200, 100, " + alpha + ")";
                    ctx.stroke();

                    const lethalAlpha = Math.max(0, 1 - prog * 1.6);
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 80, 40, " + (lethalAlpha * 0.45) + ")";
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI * 2);
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = "rgba(255, 120, 60, " + (lethalAlpha * 0.9) + ")";
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, radius, 0, Math.PI * 2);
                    ctx.lineWidth = 3 * (1 - prog) + 1;
                    ctx.strokeStyle = "rgba(255, 170, 60, " + alpha + ")";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, radius * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 220, 120, " + (alpha * 0.6) + ")";
                    ctx.fill();
                }
            }

            if (!isDead) {
                ctx.beginPath();
                ctx.arc(px, py, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = "rgb(80, 230, 120)";
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgb(180, 255, 200)";
                ctx.stroke();
            }

            if (controlMode === "touch" && !isDead) {
                drawJoystick();
            }

            // -------- HUD --------
            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            ctx.fillStyle = "rgb(230, 245, 255)";
            ctx.font = "bold 28px sans-serif";
            ctx.fillText("Счёт: " + score, 16, 16);

            ctx.fillStyle = "rgb(160, 200, 240)";
            ctx.font = "18px sans-serif";
            ctx.fillText("Лучший счёт: " + bestScore, 16, 52);

            // Текущая сложность в HUD
            ctx.fillStyle = DIFF_COLORS[difficulty];
            ctx.font = "bold 16px sans-serif";
            ctx.fillText("Сложность: " + DIFF_NAMES[difficulty], 16, 78);

            ctx.fillStyle = "rgb(120, 150, 190)";
            ctx.font = "14px sans-serif";
            ctx.fillText("Спавн шаров: " + SPAWN_INTERVAL.toFixed(2) + " с", 16, 104);
            ctx.fillText("Треугольников: " + triangles.length, 16, 124);
            ctx.fillText("Ракет: " + planes.length, 16, 142);

            ctx.fillStyle = "rgba(180, 210, 240, 0.85)";
            ctx.font = "bold 14px sans-serif";
            if (mobileDevice) {
                ctx.fillText("Кнопка «Сброс» — очищает поле", 16, 166);
            } else {
                ctx.fillText("R — сброс уровня (без перезагрузки)", 16, 166);
            }

            drawCtrlButton(now);
            drawInfoButton(now);

            if (isDead && !infoOpen) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.fillStyle = "rgb(255, 80, 80)";
                ctx.font = "bold 64px sans-serif";
                ctx.fillText("GAME OVER", WIDTH / 2, HEIGHT / 2 - 100);

                ctx.fillStyle = "rgb(230, 245, 255)";
                ctx.font = "32px sans-serif";
                ctx.fillText("Твой счёт: " + score, WIDTH / 2, HEIGHT / 2 - 20);

                ctx.fillStyle = "rgb(180, 220, 255)";
                ctx.font = "26px sans-serif";
                ctx.fillText("Лучший счёт (" + DIFF_NAMES[difficulty] + "): " + bestScore, WIDTH / 2, HEIGHT / 2 + 30);

                if (score >= bestScore && score > 0) {
                    ctx.fillStyle = "rgb(255, 220, 80)";
                    ctx.font = "bold 22px sans-serif";
                    ctx.fillText("★ НОВЫЙ РЕКОРД ★", WIDTH / 2, HEIGHT / 2 + 75);
                }

                ctx.fillStyle = "rgb(200, 200, 220)";
                ctx.font = "22px sans-serif";
                if (mobileDevice) {
                    ctx.fillText("Нажми «Сброс» чтобы продолжить", WIDTH / 2, HEIGHT / 2 + 130);
                } else {
                    ctx.fillText("Нажми R чтобы сбросить уровень", WIDTH / 2, HEIGHT / 2 + 130);
                }
            }

            if (infoOpen) {
                drawInfoOverlay();
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
