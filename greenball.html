// ============================================================
// СОХРАНЕНИЕ ПРОФИЛЯ
// ============================================================
let saveTimer = null;
function scheduleProfileSave() {
  if (!currentUser) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProfileNow, 500);
}
async function saveProfileNow() {
  if (!currentUser) return;
  saveTimer = null;
  try {
    await supabaseClient.from('profiles').update({
      coins: coins,
      owned_skins: ownedSkins,
      selected_skin: selectedSkin,
      best_easy: bestScores.easy,
      best_medium: bestScores.medium,
      best_hard: bestScores.hard
    }).eq('id', currentUser.id);
  } catch(e) { console.error("Ошибка сохранения профиля:", e); }
}

// ============================================================
// ЛИДЕРБОРД
// ============================================================
let leaderboardCache = null;
let leaderboardCacheTime = 0;
const LEADERBOARD_CACHE_MS = 5000;

async function loadLeaderboard(forceRefresh) {
  if (!supabaseClient) return [];
  const now = Date.now();
  if (!forceRefresh && leaderboardCache && (now - leaderboardCacheTime) < LEADERBOARD_CACHE_MS) {
    return leaderboardCache;
  }
  try {
    const { data, error } = await supabaseClient
      .from('leaderboard')
      .select('nickname, score, difficulty, created_at')
      .order('score', { ascending: false })
      .limit(50);
    if (error) throw error;
    leaderboardCache = (data || []).map(r => ({
      nick: r.nickname, score: r.score, difficulty: r.difficulty
    }));
    leaderboardCacheTime = now;
    return leaderboardCache;
  } catch(e) {
    console.error("Ошибка загрузки лидерборда:", e);
    return leaderboardCache || [];
  }
}

async function saveScoreToLeaderboard(nick, score, difficulty) {
  if (!supabaseClient || !nick || score <= 0) return;
  try {
    const { data: existing, error: selectError } = await supabaseClient
      .from('leaderboard')
      .select('id, score')
      .eq('nickname', nick)
      .order('score', { ascending: false })
      .limit(1);
    if (selectError) throw selectError;

    if (!existing || existing.length === 0) {
      await supabaseClient.from('leaderboard')
        .insert([{ nickname: nick, score: score, difficulty: difficulty }]);
    } else if (score > existing[0].score) {
      await supabaseClient.from('leaderboard')
        .update({ score: score, difficulty: difficulty })
        .eq('id', existing[0].id);
    }
    leaderboardCache = null;
  } catch(e) { console.error("Ошибка сохранения счёта:", e); }
}

// ============================================================

// ============================================================

const CONTROL_MODES = ["keyboard", "mouse", "touch"];

const JOYSTICK_BASE_RADIUS = 120;

const JOYSTICK_MAX_DIST = JOYSTICK_BASE_RADIUS - 12;
const JOYSTICK_MARGIN = 60;
const JOYSTICK_GRAB_RADIUS = JOYSTICK_BASE_RADIUS * 1.4;
const JOYSTICK_DEADZONE = 0.15;
const JOYSTICK_CX = JOYSTICK_MARGIN + JOYSTICK_BASE_RADIUS;
const JOYSTICK_CY = HEIGHT - JOYSTICK_MARGIN - JOYSTICK_BASE_RADIUS;

let joystickTouchId = null;
let joystickMouseDown = false;
let joystickKnobX = JOYSTICK_CX;
let joystickKnobY = JOYSTICK_CY;
let joystickDirX = 0;
let joystickDirY = 0;
let joystickMagnitude = 0;

const CTRL_BTN_W = 280;

const CTRL_BTN_Y = 16;
let ctrlBtnPressed = false;

const INFO_BTN_SIZE = 50;

const MENU_BTN_SIZE = 50;

const MENU_BTN_GAME_Y = CTRL_BTN_Y + CTRL_BTN_H + 10;
let menuBtnPressed = false;

const HOME_BTN_SIZE = 50;

const HOME_BTN_Y = CTRL_BTN_Y + CTRL_BTN_H + 10;

const INFO_PANEL_W = Math.min(WIDTH - 40, 700);
const INFO_PANEL_H = Math.min(HEIGHT - 80, 760);

const INFO_PANEL_Y = (HEIGHT - INFO_PANEL_H) / 2;

const INFO_CLOSE_W = 200;
const INFO_CLOSE_H = 54;

const DIFF_PAD = 36;

const DIFF_BTN_GAP = 20;
const DIFF_BTN_W = (DIFF_AVAIL_W - DIFF_BTN_GAP * 2) / 3;

const DIFF_BTN_X2 = DIFF_BTN_X1 + DIFF_BTN_W + DIFF_BTN_GAP;
const DIFF_BTN_X3 = DIFF_BTN_X2 + DIFF_BTN_W + DIFF_BTN_GAP;

const SHOP_COLS = 4;
const SHOP_RADIUS = 40;
const SHOP_GAP = 18;
const SHOP_CELL = SHOP_RADIUS * 2 + SHOP_GAP;
const SHOP_GRID_W = SHOP_COLS * SHOP_CELL - SHOP_GAP;
const SHOP_GRID_X = (WIDTH - SHOP_GRID_W) / 2;
const SHOP_GRID_Y = HEIGHT * 0.30;

function getSkinCellPos(i) {
  return {
    cx: SHOP_GRID_X + (i % SHOP_COLS) * SHOP_CELL + SHOP_RADIUS,
    cy: SHOP_GRID_Y + Math.floor(i / SHOP_COLS) * SHOP_CELL + SHOP_RADIUS
  };
}
function getSkinAt(x, y) {
  for (let i = 0; i < SKINS.length; i++) {
    const p = getSkinCellPos(i);
    const dx = x - p.cx, dy = y - p.cy;
    if (dx * dx + dy * dy <= SHOP_RADIUS * SHOP_RADIUS) return i;
  }
  return -1;
}
function handleSkinClick(idx) {
  if (idx < 0 || idx >= SKINS.length) return;
  if (ownedSkins.includes(idx)) {
    selectedSkin = idx;
    scheduleProfileSave();
  } else if (coins >= SKINS[idx].cost) {
    coins -= SKINS[idx].cost;
    ownedSkins.push(idx);
    selectedSkin = idx;
    scheduleProfileSave();
  }
}

function isOnInfoBtn(x, y) {
  return x >= INFO_BTN_X && x <= INFO_BTN_X + INFO_BTN_SIZE &&
         y >= INFO_BTN_Y && y <= INFO_BTN_Y + INFO_BTN_SIZE;
}

  if (x >= DIFF_BTN_X3 && x <= DIFF_BTN_X3 + DIFF_BTN_W) return "hard";
  return null;
}

function cycleControlMode() {
  controlModeIndex = (controlModeIndex + 1) % CONTROL_MODES.length;
  controlMode = CONTROL_MODES[controlModeIndex];
  if (controlMode !== "touch") {
    joystickTouchId = null;
    joystickMouseDown = false;
    resetJoystick();
  }
}
function getModeText() {
  if (controlMode === "keyboard") return "WASD";
  if (controlMode === "mouse") return "МЫШЬ";
  return "ДЖОЙСТИК";
}
function getModeColor() {
  if (controlMode === "keyboard") return "rgb(160, 220, 180)";
  if (controlMode === "mouse") return "rgb(160, 200, 255)";
  return "rgb(255, 200, 130)";
}
function isInJoystickZone(x, y) {
  const dx = x - JOYSTICK_CX;
  const dy = y - JOYSTICK_CY;
  return (dx * dx + dy * dy) <= JOYSTICK_GRAB_RADIUS * JOYSTICK_GRAB_RADIUS;
}
function setJoystickFromPoint(x, y) {
  const dx = x - JOYSTICK_CX;
  const dy = y - JOYSTICK_CY;
  const d = Math.sqrt(dx * dx + dy * dy);
  if (d < 0.001) { resetJoystick(); return; }
  const nx = dx / d, ny = dy / d;
  const cd = Math.min(d, JOYSTICK_MAX_DIST);
  joystickKnobX = JOYSTICK_CX + nx * cd;
  joystickKnobY = JOYSTICK_CY + ny * cd;
  joystickDirX = nx; joystickDirY = ny;
  joystickMagnitude = Math.min(1, d / JOYSTICK_MAX_DIST);
}
function resetJoystick() {
  joystickKnobX = JOYSTICK_CX;
  joystickKnobY = JOYSTICK_CY;
  joystickDirX = 0; joystickDirY = 0; joystickMagnitude = 0;
}

let scoreTimer = 0;
const SCORE_PER_SECOND = 10;

const MENU_BTN_GAP = 24;

    { id: "level_2", label: "3. Пропасть", x: MENU_BTN_X, y: top + (bh + g) * 2, w: MENU_BTN_W, h: bh },
    { id: "back", label: "← Назад", x: MENU_BTN_X, y: HEIGHT * 0.82, w: MENU_BTN_W, h: 70 }

}

}

  return [{ id: "back", label: "← Назад", x: MENU_BTN_X, y: HEIGHT * 0.92, w: MENU_BTN_W, h: 70 }];
}
function getActiveMenuButtons() {
  if (menuState === "main") return getMainMenuButtons();
  if (menuState === "play_menu") return getPlayMenuButtons();
  if (menuState === "levels") return getLevelsMenuButtons();
  if (menuState === "leaderboard") return getLeaderboardButtons();
  if (menuState === "shop") return getShopButtons();
  return [];
}

function dispatchMenuAction(id) {
  if (id === "play") { menuState = "play_menu"; return; }
  if (id === "levels") { menuState = "levels"; return; }
  if (id.startsWith("level_")) {
    const n = parseInt(id.replace("level_", ""), 10);
    location.href = "parkour.html?level=" + n;
    return;
  }
  if (id === "shop") { menuState = "shop"; return; }
  if (id === "leaders") { menuState = "leaderboard"; leaderboardCache = null; return; }
  if (id === "endless") {
    softReset();
    menuState = "game";
    updateRestartBtnVisibility();
    return;
  }
  if (id === "hub") { location.href = "index.html"; return; }
  if (id === "back") { menuState = "main"; return; }
}
function handleMenuClick(x, y) {
  for (const b of getActiveMenuButtons()) {
    if (b.disabled) continue;
    if (isInRect(x, y, b)) { dispatchMenuAction(b.id); return true; }
  }
  return false;
}
function goToMainMenu() {
  menuState = "main";
  infoOpen = false;
  updateRestartBtnVisibility();
}

function softReset() {
  enemies.length = 0; triangles.length = 0; planes.length = 0;
  explosions.length = 0; skidMarks.length = 0;
  px = WIDTH / 2; py = HEIGHT / 2;
  spawnTimer = 0; speedupTimer = 0;
  triangleSpawnTimer = 0; planeSpawnTimer = 0;
  SPAWN_INTERVAL = SPAWN_INTERVAL_INIT;
  score = 0; scoreTimer = 0;
  isDead = false; scoreSavedThisLife = false;
  coinsEarnedThisLife = 0;
  joystickTouchId = null; joystickMouseDown = false;
  resetJoystick();
}

function setDifficulty(newDiff) {
  if (newDiff === difficulty) return;
  difficulty = newDiff;
  applyDifficulty();
  bestScore = bestScores[difficulty] || 0;
  score = 0;
  softReset();
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "escape") {
    if (infoOpen) { infoOpen = false; return; }
    if (menuState === "game") { goToMainMenu(); return; }
    if (["play_menu", "leaderboard", "shop", "levels"].includes(menuState)) {
      menuState = "main"; return;
    }
    return;
  }
  if (menuState !== "game") return;
  if (infoOpen) return;
  if (k === "r" || k === "к") softReset();
  if (k === "q" || k === "й") cycleControlMode();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const sx = WIDTH / rect.width;
  const sy = HEIGHT / rect.height;
  return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
}
function updateMouse(e) {
  const p = canvasCoords(e.clientX, e.clientY);
  mouseX = Math.max(0, Math.min(WIDTH, p.x));
  mouseY = Math.max(0, Math.min(HEIGHT, p.y));
}
canvas.addEventListener("mousemove", updateMouse);

canvas.addEventListener("mousedown", (e) => {
  updateMouse(e);
  const p = canvasCoords(e.clientX, e.clientY);
  if (menuState !== "game") {
    if (menuState === "shop") {
      const i = getSkinAt(p.x, p.y);
      if (i >= 0) { handleSkinClick(i); return; }
    }
    handleMenuClick(p.x, p.y);
    return;
  }
  if (infoOpen) {
    if (isOnInfoClose(p.x, p.y)) { infoCloseBtnPressed = true; return; }
    const d = getDiffButtonAt(p.x, p.y);
    if (d) { setDifficulty(d); return; }
    if (!isOnInfoPanel(p.x, p.y)) infoOpen = false;
    return;
  }
  if (isOnCtrlButton(p.x, p.y)) { ctrlBtnPressed = true; return; }
  if (isOnInfoBtn(p.x, p.y)) { infoBtnPressed = true; return; }
  if (isOnHomeBtn(p.x, p.y)) { homeBtnPressed = true; return; }
  if (isOnMenuBtnGame(p.x, p.y)) { menuBtnPressed = true; return; }
  if (controlMode === "touch" && isInJoystickZone(p.x, p.y)) {
    joystickMouseDown = true;
    setJoystickFromPoint(p.x, p.y);
  }
});
canvas.addEventListener("mousemove", (e) => {
  if (menuState !== "game" || infoOpen || !joystickMouseDown) return;
  const p = canvasCoords(e.clientX, e.clientY);
  setJoystickFromPoint(p.x, p.y);
});
window.addEventListener("mouseup", () => {
  if (infoCloseBtnPressed) { infoCloseBtnPressed = false; infoOpen = false; return; }
  if (infoBtnPressed) { infoBtnPressed = false; infoOpen = true; return; }
  if (homeBtnPressed) { homeBtnPressed = false; location.href = "index.html"; return; }
  if (menuBtnPressed) { menuBtnPressed = false; goToMainMenu(); return; }
  if (ctrlBtnPressed) { ctrlBtnPressed = false; cycleControlMode(); return; }
  if (joystickMouseDown) { joystickMouseDown = false; resetJoystick(); }
});

function touchToCanvas(t) { return canvasCoords(t.clientX, t.clientY); }

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = touchToCanvas(t);
    if (menuState !== "game") {
      if (menuState === "shop") {
        const i = getSkinAt(p.x, p.y);
        if (i >= 0) { handleSkinClick(i); continue; }
      }
      handleMenuClick(p.x, p.y);
      continue;
    }
    if (infoOpen) {
      if (isOnInfoClose(p.x, p.y)) { infoOpen = false; continue; }
      const d = getDiffButtonAt(p.x, p.y);
      if (d) { setDifficulty(d); continue; }
      if (!isOnInfoPanel(p.x, p.y)) infoOpen = false;
      continue;
    }
    if (isOnHomeBtn(p.x, p.y)) { location.href = "index.html"; continue; }
    if (isOnMenuBtnGame(p.x, p.y)) { goToMainMenu(); continue; }
    if (isOnInfoBtn(p.x, p.y)) { infoOpen = true; continue; }
    if (isOnCtrlButton(p.x, p.y)) { cycleControlMode(); continue; }
    if (controlMode === "touch" && joystickTouchId === null && isInJoystickZone(p.x, p.y)) {
      joystickTouchId = t.identifier;
      setJoystickFromPoint(p.x, p.y);
    }
  }
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (menuState !== "game" || infoOpen) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      const p = touchToCanvas(t);
      setJoystickFromPoint(p.x, p.y);
    }
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      joystickTouchId = null; resetJoystick();
    }
  }
}, { passive: false });

canvas.addEventListener("touchcancel", (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      joystickTouchId = null; resetJoystick();
    }
  }
});

restartBtn.textContent = mobileDevice ? "↻ Сброс" : "↻ Перезагрузка";
restartBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (infoOpen) { infoOpen = false; return; }
  if (mobileDevice) softReset();
  else location.reload();
});

function drawTriangle(x, y, angle, fill) {
  const r = TRIANGLE_SIZE;
  const h = r * Math.sqrt(3) / 2;
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(-r/2, -h); ctx.lineTo(-r/2, h);
  ctx.closePath();

  ctx.restore();
}
function drawPlane(x, y, angle, fill) {

  ctx.moveTo(s, 0);
  ctx.lineTo(-s*0.3, -s*0.25); ctx.lineTo(-s*0.3, -s*0.9);

  ctx.lineTo(-s*0.7, s*0.25); ctx.lineTo(-s*0.7, s*0.9);
  ctx.lineTo(-s*0.3, s*0.9); ctx.lineTo(-s*0.3, s*0.25);

  ctx.restore();
}

function drawGear(cx, cy, oR, iR, teeth, hR, fill) {
  const steps = teeth * 4;
  const off = -Math.PI / 2;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = off + (i / steps) * Math.PI * 2;
    const ph = i % 4;
    const r = (ph === 0 || ph === 1) ? oR : iR;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.moveTo(cx + hR, cy);
  ctx.arc(cx, cy, hR, 0, Math.PI*2, true);
  ctx.fillStyle = fill; ctx.fill();
}
function drawHamburger(cx, cy, size, color) {
  const w = size;
  const h = Math.max(2, size * 0.12);
  const gap = size * 0.28;
  ctx.fillStyle = color;
  ctx.fillRect(cx - w/2, cy - gap - h/2, w, h);

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);

  if (side === 0) { ex = Math.random() * (WIDTH - 2*ENEMY_RADIUS) + ENEMY_RADIUS; ey = ENEMY_RADIUS; }
  else if (side === 1) { ex = WIDTH - ENEMY_RADIUS; ey = Math.random() * (HEIGHT - 2*ENEMY_RADIUS) + ENEMY_RADIUS; }
  else if (side === 2) { ex = Math.random() * (WIDTH - 2*ENEMY_RADIUS) + ENEMY_RADIUS; ey = HEIGHT - ENEMY_RADIUS; }
  else { ex = ENEMY_RADIUS; ey = Math.random() * (HEIGHT - 2*ENEMY_RADIUS) + ENEMY_RADIUS; }
  enemies.push({ x: ex, y: ey, dx: 0, dy: 0, state: "warning", warningTimer: 0 });
}
function spawnTriangle() {
  const side = Math.floor(Math.random() * 4);
  let tx, ty;
  if (side === 0) { tx = Math.random() * (WIDTH - 2*TRIANGLE_SIZE) + TRIANGLE_SIZE; ty = TRIANGLE_SIZE; }
  else if (side === 1) { tx = WIDTH - TRIANGLE_SIZE; ty = Math.random() * (HEIGHT - 2*TRIANGLE_SIZE) + TRIANGLE_SIZE; }
  else if (side === 2) { tx = Math.random() * (WIDTH - 2*TRIANGLE_SIZE) + TRIANGLE_SIZE; ty = HEIGHT - TRIANGLE_SIZE; }
  else { tx = TRIANGLE_SIZE; ty = Math.random() * (HEIGHT - 2*TRIANGLE_SIZE) + TRIANGLE_SIZE; }
  triangles.push({ x: tx, y: ty, vx: 0, vy: 0, angle: 0, age: 0, state: "warning", warningTimer: 0, lastSkidX: tx, lastSkidY: ty });
}
function spawnPlane() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * (WIDTH - 2*PLANE_SIZE) + PLANE_SIZE; y = PLANE_SIZE; }
  else if (side === 1) { x = WIDTH - PLANE_SIZE; y = Math.random() * (HEIGHT - 2*PLANE_SIZE) + PLANE_SIZE; }
  else if (side === 2) { x = Math.random() * (WIDTH - 2*PLANE_SIZE) + PLANE_SIZE; y = HEIGHT - PLANE_SIZE; }
  else { x = PLANE_SIZE; y = Math.random() * (HEIGHT - 2*PLANE_SIZE) + PLANE_SIZE; }
  const tx = px, ty = py;
  let dx = tx - x, dy = ty - y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  dx /= len; dy /= len;
  planes.push({ x: x, y: y, dx: dx, dy: dy, angle: Math.atan2(dy, dx), traveled: 0, inZoneTimer: 0 });
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ

let lastTime = performance.now();

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (menuState === "game") {
    if (!isDead && !infoOpen) {
      let dx = 0, dy = 0;
      if (controlMode === "keyboard") {
        if (keys["a"] || keys["ф"]) dx -= 1;
        if (keys["d"] || keys["в"]) dx += 1;
        if (keys["w"] || keys["ц"]) dy -= 1;
        if (keys["s"] || keys["ы"]) dy += 1;
        if (dx !== 0 && dy !== 0) {
          const l = Math.sqrt(dx*dx + dy*dy);
          dx /= l; dy /= l;
        }
        px += dx * SPEED * dt;
        py += dy * SPEED * dt;
      } else if (controlMode === "mouse") {
        const mdx = mouseX - px, mdy = mouseY - py;
        const d = Math.sqrt(mdx*mdx + mdy*mdy);
        if (d > MOUSE_DEADZONE) {
          const step = SPEED * dt;
          if (step >= d) { px = mouseX; py = mouseY; }
          else { px += (mdx/d) * step; py += (mdy/d) * step; }
        }
      } else {
        if (joystickMagnitude > JOYSTICK_DEADZONE && (joystickDirX !== 0 || joystickDirY !== 0)) {
          px += joystickDirX * SPEED * dt;
          py += joystickDirY * SPEED * dt;
        }
      }
      if (px < BALL_RADIUS) px = BALL_RADIUS;
      if (px > WIDTH - BALL_RADIUS) px = WIDTH - BALL_RADIUS;
      if (py < BALL_RADIUS) py = BALL_RADIUS;
      if (py > HEIGHT - BALL_RADIUS) py = HEIGHT - BALL_RADIUS;

      scoreTimer += dt;
      if (scoreTimer >= 1) {
        scoreTimer -= 1;
        score += SCORE_PER_SECOND;
        if (score > bestScore) {
          bestScore = score;
          bestScores[difficulty] = score;
          scheduleProfileSave();
        }
      }
      speedupTimer += dt;
      if (speedupTimer >= SPEEDUP_EVERY) {
        speedupTimer -= SPEEDUP_EVERY;
        SPAWN_INTERVAL = Math.max(SPAWN_MIN, SPAWN_INTERVAL * SPEEDUP_FACTOR);
      }
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INTERVAL) { spawnTimer -= SPAWN_INTERVAL; spawnEnemy(); }
      triangleSpawnTimer += dt;
      if (triangleSpawnTimer >= TRIANGLE_SPAWN_INTERVAL) { triangleSpawnTimer -= TRIANGLE_SPAWN_INTERVAL; spawnTriangle(); }
      planeSpawnTimer += dt;
      if (planeSpawnTimer >= PLANE_SPAWN_INTERVAL) { planeSpawnTimer -= PLANE_SPAWN_INTERVAL; spawnPlane(); }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.state === "warning") {
          e.warningTimer += dt;
          if (e.warningTimer >= WARNING_TIME) {
            let ddx = px - e.x, ddy = py - e.y;
            const l = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
            e.dx = ddx/l; e.dy = ddy/l;
            e.state = "attack";
          }
        } else {
          e.x += e.dx * ENEMY_SPEED * dt;
          e.y += e.dy * ENEMY_SPEED * dt;
          if (e.x < -ENEMY_RADIUS || e.x > WIDTH + ENEMY_RADIUS ||
              e.y < -ENEMY_RADIUS || e.y > HEIGHT + ENEMY_RADIUS) {
            enemies.splice(i, 1); continue;
          }
          const ddx = e.x - px, ddy = e.y - py;
          const d = Math.sqrt(ddx*ddx + ddy*ddy);
          if (d < ENEMY_RADIUS + BALL_RADIUS) {
            isDead = true;
            enemies.length = 0; triangles.length = 0; planes.length = 0;
            break;
          }
        }
      }

      if (!isDead) {
        for (let i = triangles.length - 1; i >= 0; i--) {
          const t = triangles[i];
          if (t.state === "warning") {
            t.warningTimer += dt;
            const adx = px - t.x, ady = py - t.y;
            const ta = Math.atan2(ady, adx);
            let diff = ta - t.angle;
            while (diff > Math.PI) diff -= Math.PI*2;
            while (diff < -Math.PI) diff += Math.PI*2;
            t.angle += diff * Math.min(1, TRIANGLE_TURN_RATE * dt);
            if (t.warningTimer >= TRIANGLE_WARNING_TIME) { t.state = "attack"; t.age = 0; }
            continue;
          }
          t.age += dt;
          if (t.age >= TRIANGLE_LIFETIME) {
            explosions.push({ x: t.x, y: t.y, t: 0, duration: 0.45, maxRadius: 42, killsPlayer: false });
            triangles.splice(i, 1); continue;
          }
          const ddx = px - t.x, ddy = py - t.y;
          const ta = Math.atan2(ddy, ddx);
          let diff = ta - t.angle;
          while (diff > Math.PI) diff -= Math.PI*2;
          while (diff < -Math.PI) diff += Math.PI*2;
          const mt = TRIANGLE_TURN_RATE * dt;
          if (Math.abs(diff) > mt) t.angle += Math.sign(diff) * mt;
          else t.angle = ta;
          const ivx = Math.cos(t.angle) * TRIANGLE_SPEED;
          const ivy = Math.sin(t.angle) * TRIANGLE_SPEED;
          const grip = Math.min(1, TRIANGLE_GRIP * dt);
          t.vx += (ivx - t.vx) * grip;
          t.vy += (ivy - t.vy) * grip;
          t.x += t.vx * dt; t.y += t.vy * dt;
          const va = Math.atan2(t.vy, t.vx);
          let dd = va - t.angle;
          while (dd > Math.PI) dd -= Math.PI*2;
          while (dd < -Math.PI) dd += Math.PI*2;
          const da = Math.abs(dd);
          const cs = Math.sqrt(t.vx*t.vx + t.vy*t.vy);
          if (da > DRIFT_THRESHOLD && cs > 60) {
            const skdx = t.x - t.lastSkidX, skdy = t.y - t.lastSkidY;
            const skd = Math.sqrt(skdx*skdx + skdy*skdy);
            if (skd > 6) {
              const px2 = Math.cos(t.angle + Math.PI/2) * TRIANGLE_SIZE * 0.7;
              const py2 = Math.sin(t.angle + Math.PI/2) * TRIANGLE_SIZE * 0.7;
              skidMarks.push({ x: t.x - px2, y: t.y - py2, t: 0, life: 0.9, intensity: Math.min(1, (da - DRIFT_THRESHOLD) * 2) });
              skidMarks.push({ x: t.x + px2, y: t.y + py2, t: 0, life: 0.9, intensity: Math.min(1, (da - DRIFT_THRESHOLD) * 2) });
              t.lastSkidX = t.x; t.lastSkidY = t.y;
            }
          } else {
            t.lastSkidX = t.x; t.lastSkidY = t.y;
          }
          const dtp = Math.sqrt((t.x - px)*(t.x - px) + (t.y - py)*(t.y - py));
          if (dtp < TRIANGLE_SIZE * 0.7 + BALL_RADIUS) {
            isDead = true;
            enemies.length = 0; triangles.length = 0; planes.length = 0;
            break;
          }
        }
      }

      if (!isDead) {
        for (let i = planes.length - 1; i >= 0; i--) {
          const p = planes[i];
          p.x += p.dx * PLANE_SPEED * dt;
          p.y += p.dy * PLANE_SPEED * dt;
          p.traveled += PLANE_SPEED * dt;
          if (p.traveled > PLANE_MAX_PATH) { planes.splice(i, 1); continue; }
          const ddx = px - p.x, ddy = py - p.y;
          const d = Math.sqrt(ddx*ddx + ddy*ddy);
          if (d < PLANE_EXPLOSION_RADIUS) {
            p.inZoneTimer += dt;
            if (p.inZoneTimer >= PLANE_DANGER_DELAY) {
              explosions.push({
                x: p.x, y: p.y, t: 0, duration: 0.7,
                maxRadius: PLANE_EXPLOSION_RADIUS * 1.4,
                lethalRadius: PLANE_EXPLOSION_RADIUS,
                killsPlayer: true
              });
              planes.splice(i, 1); continue;
            }
          } else p.inZoneTimer = 0;
        }
      }
    }

    for (let i = explosions.length - 1; i >= 0; i--) {
      const ex = explosions[i];
      ex.t += dt;
      if (ex.killsPlayer && !isDead && !infoOpen) {
        const ddx = px - ex.x, ddy = py - ex.y;
        const d = Math.sqrt(ddx*ddx + ddy*ddy);
        if (d < ex.lethalRadius) {
          isDead = true;
          enemies.length = 0; triangles.length = 0; planes.length = 0;
        }
      }
      if (ex.t >= ex.duration) explosions.splice(i, 1);
    }
    for (let i = skidMarks.length - 1; i >= 0; i--) {
      const s = skidMarks[i];
      s.t += dt;
      if (s.t >= s.life) skidMarks.splice(i, 1);
    }

    if (isDead && !scoreSavedThisLife) {
      if (nickname && score > 0) saveScoreToLeaderboard(nickname, score, difficulty);
      const earned = Math.floor(score / 100);
      if (earned > 0) {
        coins += earned;
        coinsEarnedThisLife = earned;
        scheduleProfileSave();
      }
      scoreSavedThisLife = true;
    }

    ctx.fillStyle = "rgb(10, 15, 40)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    if (controlMode === "mouse" && !isDead) {
      ctx.beginPath(); ctx.arc(mouseX, mouseY, 6, 0, Math.PI*2);
      ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(120, 200, 255, 0.7)"; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mouseX - 10, mouseY); ctx.lineTo(mouseX - 3, mouseY);
      ctx.moveTo(mouseX + 3, mouseY); ctx.lineTo(mouseX + 10, mouseY);
      ctx.moveTo(mouseX, mouseY - 10); ctx.lineTo(mouseX, mouseY - 3);
      ctx.moveTo(mouseX, mouseY + 3); ctx.lineTo(mouseX, mouseY + 10);
      ctx.strokeStyle = "rgba(120, 200, 255, 0.5)"; ctx.stroke();
    }
    for (const s of skidMarks) {
      const p = s.t / s.life;
      const a = (1 - p) * 0.55 * s.intensity;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.5 + p * 2, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255, 130, 50, " + a + ")"; ctx.fill();
    }
    for (const e of enemies) {
      if (e.state === "warning") {
        const tt = e.warningTimer / WARNING_TIME;
        const pulse = 0.5 + 0.5 * Math.sin(e.warningTimer * 30);
        const rr = ENEMY_RADIUS + (1 - tt) * 14;
        ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, Math.PI*2);
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(250, 220, 60, " + (0.4 + 0.4*pulse) + ")"; ctx.stroke();
        ctx.beginPath(); ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = "rgba(250, 220, 60, " + (0.35 + 0.3*pulse) + ")"; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = "rgb(250, 220, 60)"; ctx.fill();
      }
    }
    for (const t of triangles) {
      if (t.state === "warning") {
        const tt = t.warningTimer / TRIANGLE_WARNING_TIME;
        const pulse = 0.5 + 0.5 * Math.sin(t.warningTimer * 30);
        const rr = TRIANGLE_SIZE + (1 - tt) * 14;
        ctx.beginPath(); ctx.arc(t.x, t.y, rr, 0, Math.PI*2);
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255, 140, 40, " + (0.4 + 0.4*pulse) + ")"; ctx.stroke();
        ctx.globalAlpha = 0.35 + 0.3*pulse;
        drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);
        ctx.globalAlpha = 1;
        continue;
      }
      drawTriangle(t.x, t.y, t.angle, TRIANGLE_COLOR);
      const ll = 1 - t.age / TRIANGLE_LIFETIME;
      const br = 6 + (1 - ll) * 20;
      const ba = 0.4 + 0.6 * Math.abs(Math.sin(t.age * br));
      ctx.beginPath(); ctx.arc(t.x, t.y, 2.5, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255, 255, 200, " + ba + ")"; ctx.fill();
    }
    for (const p of planes) {
      drawPlane(p.x, p.y, p.angle, "rgb(240, 240, 250)");
      if (p.inZoneTimer > 0) {
        const pr = p.inZoneTimer / PLANE_DANGER_DELAY;
        const rr = PLANE_SIZE + (PLANE_EXPLOSION_RADIUS - PLANE_SIZE) * (1 - pr);
        ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255, 60, 30, 0.08)"; ctx.fill();
        const pulse = 0.65 + 0.35 * Math.sin(now / 60);
        ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI*2);
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255, 100, 50, " + pulse + ")"; ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x, p.y, PLANE_SIZE * 0.9, 0, Math.PI*2);
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255, 80, 40, " + pulse + ")"; ctx.stroke();
      } else {
        const pulse = 0.4 + 0.3 * Math.sin(now / 100 + p.x);
        ctx.beginPath(); ctx.arc(p.x, p.y, PLANE_SIZE * 0.9, 0, Math.PI*2);
        ctx.lineWidth = 1; ctx.strokeStyle = "rgba(220, 220, 255, " + pulse + ")"; ctx.stroke();
      }
    }
    for (const ex of explosions) {
      const pr = ex.t / ex.duration;
      const rad = 8 + pr * (ex.maxRadius - 8);
      const a = 1 - pr;
      if (ex.killsPlayer) {
        ctx.beginPath(); ctx.arc(ex.x, ex.y, rad, 0, Math.PI*2);
        ctx.lineWidth = 3 * (1 - pr) + 1.5; ctx.strokeStyle = "rgba(255, 200, 100, " + a + ")"; ctx.stroke();
        const la = Math.max(0, 1 - pr * 1.6);
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255, 80, 40, " + (la * 0.45) + ")"; ctx.fill();
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.lethalRadius, 0, Math.PI*2);
        ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255, 120, 60, " + (la * 0.9) + ")"; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(ex.x, ex.y, rad, 0, Math.PI*2);
        ctx.lineWidth = 3 * (1 - pr) + 1; ctx.strokeStyle = "rgba(255, 170, 60, " + a + ")"; ctx.stroke();
        ctx.beginPath(); ctx.arc(ex.x, ex.y, rad * 0.6, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255, 220, 120, " + (a * 0.6) + ")"; ctx.fill();
      }
    }
    if (!isDead) {
      const sc = getSkinColors();
      const grad = ctx.createRadialGradient(
        px - BALL_RADIUS * 0.3, py - BALL_RADIUS * 0.3, BALL_RADIUS * 0.15,
        px, py, BALL_RADIUS);
      grad.addColorStop(0, sc.light);
      grad.addColorStop(0.5, sc.base);
      grad.addColorStop(1, sc.dark);
      ctx.beginPath(); ctx.arc(px, py, BALL_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = grad; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = sc.outline; ctx.stroke();
    }
    if (controlMode === "touch" && !isDead) drawJoystick();

    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = "rgb(230, 245, 255)"; ctx.font = "bold 28px sans-serif";
    ctx.fillText("Счёт: " + score, 16, 16);
    ctx.fillStyle = "rgb(160, 200, 240)"; ctx.font = "18px sans-serif";
    ctx.fillText("Лучший счёт: " + bestScore, 16, 52);
    ctx.fillStyle = DIFF_COLORS[difficulty]; ctx.font = "bold 16px sans-serif";
    ctx.fillText("Сложность: " + DIFF_NAMES[difficulty], 16, 78);
    drawCoinIcon(26, 108, 11);
    ctx.fillStyle = "rgb(255, 220, 100)"; ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(String(coins), 44, 109);
    ctx.textAlign = "left"; ctx.textBaseline = "top";

    if (nickname) {
      ctx.fillStyle = "rgba(160, 200, 240, 0.8)"; ctx.font = "15px sans-serif";
      ctx.fillText("Игрок: " + nickname, 16, 128);
    }
    ctx.fillStyle = "rgb(120, 150, 190)"; ctx.font = "14px sans-serif";
    ctx.fillText("Спавн шаров: " + SPAWN_INTERVAL.toFixed(2) + " с", 16, 152);
    ctx.fillText("Треугольников: " + triangles.length, 16, 172);
    ctx.fillText("Ракет: " + planes.length, 16, 190);
    ctx.fillStyle = "rgba(180, 210, 240, 0.85)"; ctx.font = "bold 14px sans-serif";
    if (mobileDevice) ctx.fillText("Кнопка «Сброс» — очищает поле", 16, 214);
    else ctx.fillText("R — сброс · Esc — меню", 16, 214);

    drawCtrlButton(now);
    drawHomeBtn(now);
    drawMenuBtnGame(now);
    drawInfoButton(now);

    if (isDead && !infoOpen) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgb(255, 80, 80)"; ctx.font = "bold 64px sans-serif";
      ctx.fillText("GAME OVER", WIDTH/2, HEIGHT/2 - 130);
      ctx.fillStyle = "rgb(230, 245, 255)"; ctx.font = "32px sans-serif";
      ctx.fillText("Твой счёт: " + score, WIDTH/2, HEIGHT/2 - 50);
      ctx.fillStyle = "rgb(180, 220, 255)"; ctx.font = "26px sans-serif";
      ctx.fillText("Лучший счёт (" + DIFF_NAMES[difficulty] + "): " + bestScore, WIDTH/2, HEIGHT/2 - 5);
      if (coinsEarnedThisLife > 0) {
        drawCoinIcon(WIDTH/2 - 50, HEIGHT/2 + 55, 16);
        ctx.fillStyle = "rgb(255, 240, 170)"; ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("+" + coinsEarnedThisLife, WIDTH/2 - 24, HEIGHT/2 + 56);
        ctx.textAlign = "center";
      }
      if (score >= bestScore && score > 0) {
        ctx.fillStyle = "rgb(255, 220, 80)"; ctx.font = "bold 22px sans-serif";
        ctx.fillText("★ НОВЫЙ РЕКОРД ★", WIDTH/2, HEIGHT/2 + 105);
      }
      ctx.fillStyle = "rgb(200, 200, 220)"; ctx.font = "22px sans-serif";
      if (mobileDevice) ctx.fillText("Нажми «Сброс» чтобы продолжить", WIDTH/2, HEIGHT/2 + 155);
      else ctx.fillText("R — заново · Esc — меню", WIDTH/2, HEIGHT/2 + 155);
    }
    if (infoOpen) drawInfoOverlay();
  } else {
    ctx.fillStyle = "rgb(10, 15, 40)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    drawMenuScreen(now);
  }

  requestAnimationFrame(loop);
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
async function initGame() {
  try {
    // ВАЖНО: используем getSession() вместо getUser()
    // getSession() читает токен из localStorage — работает мгновенно
    // getUser() делает сетевой запрос — может упасть из-за плохой сети
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

    if (sessionError || !session || !session.user) {
      console.warn("Нет сессии, редирект на хаб");
      location.href = "index.html";
      return;
    }

    currentUser = session.user;

    // Загружаем профиль
    const { data, error: profileError } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .maybeSingle();

    if (profileError) console.error("Ошибка загрузки профиля:", profileError);

    if (!data) {
      // Профиля нет — создаём с дефолтными данными
      const nick = currentUser.user_metadata?.nickname || 'Игрок';
      const { data: created, error: insertError } = await supabaseClient
        .from('profiles')
        .insert([{ id: currentUser.id, nickname: nick }])
        .select()
        .single();

      if (insertError) {
        console.error("Ошибка создания профиля:", insertError);
        // Продолжаем с дефолтными значениями, но не блокируем игру
        nickname = nick;
        coins = 0;
        ownedSkins = [0];
        selectedSkin = 0;
        bestScores = { easy: 0, medium: 0, hard: 0 };
      } else {
        profile = created;
      }
    } else {
      profile = data;
    }

    // Применяем загруженный профиль
    if (profile) {
      nickname = profile.nickname || "Игрок";
      coins = Number(profile.coins) || 0;
      ownedSkins = Array.isArray(profile.owned_skins) ? profile.owned_skins.slice() : [0];
      if (!ownedSkins.includes(0)) ownedSkins.unshift(0);
      selectedSkin = Number(profile.selected_skin) || 0;
      if (!ownedSkins.includes(selectedSkin)) selectedSkin = 0;
      bestScores = {
        easy: Number(profile.best_easy) || 0,
        medium: Number(profile.best_medium) || 0,
        hard: Number(profile.best_hard) || 0
      };
    }

    bestScore = bestScores[difficulty] || 0;
    applyDifficulty();
    softReset();
    updateRestartBtnVisibility();
    loadingOverlay.classList.add("hidden");
    requestAnimationFrame(loop);
  } catch (e) {
    console.error("Ошибка инициализации:", e);
    loadingOverlay.textContent = "Ошибка загрузки. Откройте хаб заново.";
  }
}

initGame();
</script>
